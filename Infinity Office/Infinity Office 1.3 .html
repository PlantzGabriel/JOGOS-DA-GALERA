<!DOCTYPE html>
<html>
<head>
    <title>Office Runner 3D - Pro Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: rgba(0,0,0,0.88); color: white; z-index: 10;
        }
        button { 
            padding: 18px 45px; font-size: 22px; cursor: pointer; border: none; 
            border-radius: 8px; background: #00ffaa; color: #000; font-weight: bold; margin: 15px;
            transition: 0.2s; box-shadow: 0 4px 10px rgba(0,255,170,0.3);
        }
        button:hover { transform: scale(1.1); background: #fff; box-shadow: 0 4px 15px rgba(255,255,255,0.4); }
        .skin-container { display: flex; gap: 15px; margin-top: 25px; margin-bottom: 25px;}
        .skin-btn { width: 50px; height: 50px; border: 3px solid white; cursor: pointer; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        #game-ui { position: absolute; top: 25px; left: 25px; color: white; font-size: 32px; display: none; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-ui">PONTOS: 0</div>

    <div id="menu-start" class="overlay">
        <h1 style="letter-spacing: 7px; color: #00ffaa; font-size: 48px; margin-bottom: 5px;">OFFICE RUNNER 3D</h1>
        <p style="margin-top: 0; color: #aaa; margin-bottom: 30px;">Corra das cadeiras, abaixe sob as luzes!</p>
        <button onclick="startGame()">INICIAR CORRIDA</button>
        <p style="color: #eee;">Escolha a cor da sua Roupa:</p>
        <div class="skin-container">
            <div class="skin-btn" style="background: #00d2ff" onclick="changeSkin(0x00d2ff)"></div>
            <div class="skin-btn" style="background: #ff0055" onclick="changeSkin(0xff0055)"></div>
            <div class="skin-btn" style="background: #00ff55" onclick="changeSkin(0x00ff55)"></div>
            <div class="skin-btn" style="background: #ffff00" onclick="changeSkin(0xffff00)"></div>
        </div>
    </div>

    <div id="menu-death" class="overlay hidden">
        <h1 style="color: #ff0055; font-size: 48px;">DEMITIDO!</h1>
        <h2 id="final-score" style="color: white; margin-bottom: 40px;">PONTOS: 0</h2>
        <button onclick="startGame()">TENTAR DE NOVO</button>
        <button onclick="backToMenu()" style="background: #555; color: white;">MENU PRINCIPAL</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, playerGroup, playerTorso, playerHead, playerLArm, playerRArm, playerLLeg, playerRLeg;
    let obstacles = [];
    let gameActive = false;
    let score = 0;
    let speed = 0.48;
    let currentLane = 1;
    const lanes = [-2.8, 0, 2.8];
    let isJumping = false;
    let isDucking = false;
    let velocityY = 0;
    let playerColor = 0x00d2ff;
    let duckTimeout;
    let runCycle = 0;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x10101a);
        scene.fog = new THREE.Fog(0x10101a, 25, 70);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 9);
        camera.lookAt(0, 1.5, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light1 = new THREE.DirectionalLight(0xffffff, 2.2);
        light1.position.set(10, 20, 15);
        scene.add(light1, new THREE.AmbientLight(0x707070));

        const light2 = new THREE.DirectionalLight(0xaabbff, 0.8);
        light2.position.set(-10, -5, -10);
        scene.add(light2);

        // Chão de Escritório
        const floorGeo = new THREE.PlaneGeometry(12, 2000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const grid = new THREE.GridHelper(1000, 120, 0x333333, 0x222222);
        grid.position.y = 0.02;
        scene.add(grid);

        // --- CONSTRUIR O BONEQUINHO ---
        playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const matHead = new THREE.MeshStandardMaterial({ color: 0xffdbac }); // Cor de pele
        const matSuit = new THREE.MeshStandardMaterial({ color: playerColor }); // Cor da roupa
        const matBlack = new THREE.MeshStandardMaterial({ color: 0x111111 });

        // Cabeça
        playerHead = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.4), matHead);
        playerHead.position.set(0, 1.6, 0);
        playerGroup.add(playerHead);

        // Torso
        playerTorso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.35), matSuit);
        playerTorso.position.set(0, 1.1, 0);
        playerGroup.add(playerTorso);

        // Braços
        const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.7);
        playerLArm = new THREE.Mesh(armGeo, matHead);
        playerLArm.position.set(-0.45, 1.2, 0);
        playerGroup.add(playerLArm);

        playerRArm = new THREE.Mesh(armGeo, matHead);
        playerRArm.position.set(0.45, 1.2, 0);
        playerGroup.add(playerRArm);

        // Pernas
        const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.9);
        playerLLeg = new THREE.Mesh(legGeo, matBlack);
        playerLLeg.position.set(-0.2, 0.45, 0);
        playerGroup.add(playerLLeg);

        playerRLeg = new THREE.Mesh(legGeo, matBlack);
        playerRLeg.position.set(0.2, 0.45, 0);
        playerGroup.add(playerRLeg);

        // Posição inicial do grupo
        playerGroup.position.set(0, 0, 0);

        animate();
    }

    function animatePlayer(delta) {
        if (!gameActive || isJumping || isDucking) return;

        runCycle += delta * speed * 40;
        const amplitudeLeg = 0.7;
        const amplitudeArm = 0.9;

        playerLLeg.rotation.x = Math.sin(runCycle) * amplitudeLeg;
        playerRLeg.rotation.x = Math.sin(runCycle + Math.PI) * amplitudeLeg;
        playerLArm.rotation.x = Math.sin(runCycle + Math.PI) * amplitudeArm;
        playerRArm.rotation.x = Math.sin(runCycle) * amplitudeArm;
        playerTorso.rotation.x = Math.sin(runCycle*2) * 0.05; // Bobbing suave
    }

    function createChair() {
        const chairGroup = new THREE.Group();
        const matChair = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const matMetal = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 1 });

        // Assento
        const seat = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.15, 1.3), matChair);
        seat.position.set(0, 0.7, 0);
        chairGroup.add(seat);

        // Encosto
        const back = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 0.15), matChair);
        back.position.set(0, 1.3, -0.6);
        back.rotation.x = 0.1;
        chairGroup.add(back);

        // Base/Perna central
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.7), matMetal);
        base.position.set(0, 0.35, 0);
        chairGroup.add(base);

        // Pés com rodinhas
        const legGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.8);
        for(let i=0; i<4; i++){
            const leg = new THREE.Mesh(legGeo, matMetal);
            leg.position.set(i<2?0.3:-0.3, 0.15, i%2==0?0.3:-0.3);
            leg.rotation.y = Math.PI / 4;
            chairGroup.add(leg);
        }

        chairGroup.userData = { isHigh: false };
        return chairGroup;
    }

    function createHangingLight() {
        const lightGroup = new THREE.Group();
        const matLight = new THREE.MeshStandardMaterial({ color: 0xcccccc, emissive: 0xffffff, emissiveIntensity: 1 });
        const matWire = new THREE.MeshStandardMaterial({ color: 0x333333 });

        // Luminária principal
        const lightFixture = new THREE.Mesh(new THREE.BoxGeometry(4, 0.25, 1.0), matLight);
        lightFixture.position.set(0, 3.8, 0);
        // Inclinação suave para parecer solta
        lightFixture.rotation.set((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2);
        lightGroup.add(lightFixture);

        // Fios/Suportes
        const wireGeo = new THREE.CylinderGeometry(0.02, 0.02, 2);
        const wire1 = new THREE.Mesh(wireGeo, matWire);
        wire1.position.set(-1.8, 4.8, 0);
        lightGroup.add(wire1);
        const wire2 = new THREE.Mesh(wireGeo, matWire);
        wire2.position.set(1.8, 4.8, 0);
        lightGroup.add(wire2);

        // Fio quebrado "meio solto"
        const brokenWire = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1), matWire);
        brokenWire.position.set(2, 4.2, 0.1);
        brokenWire.rotation.set(1.2, 0, 0.5);
        lightGroup.add(brokenWire);

        lightGroup.userData = { isHigh: true };
        return lightGroup;
    }

    function cancelDuck() {
        isDucking = false;
        playerGroup.scale.y = 1;
        playerGroup.position.y = isJumping ? playerGroup.position.y : 0;
        if(duckTimeout) clearTimeout(duckTimeout);
    }

    window.startGame = () => {
        score = 0;
        speed = 0.48;
        currentLane = 1;
        obstacles.forEach(o => scene.remove(o));
        obstacles = [];
        gameActive = true;
        document.getElementById('game-ui').innerText = "PONTOS: 0";
        document.getElementById('menu-start').classList.add('hidden');
        document.getElementById('menu-death').classList.add('hidden');
        document.getElementById('game-ui').style.display = 'block';
    };

    window.backToMenu = () => {
        document.getElementById('menu-death').classList.add('hidden');
        document.getElementById('menu-start').classList.remove('hidden');
        document.getElementById('game-ui').style.display = 'none';
    };

    window.changeSkin = (color) => {
        playerColor = color;
        playerTorso.material.color.setHex(color);
        playerHead.material.color.setHex(color); // Cor de chapéu agora?
    };

    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;

        if (e.code === 'ArrowLeft' && currentLane > 0) currentLane--;
        if (e.code === 'ArrowRight' && currentLane < 2) currentLane++;

        if (e.code === 'ArrowUp' || e.code === 'Space') {
            if (!isJumping) {
                if (isDucking) cancelDuck();
                velocityY = 0.38;
                isJumping = true;
                // Posição de pulo
                playerLLeg.rotation.x = -0.5;
                playerRLeg.rotation.x = 0.3;
            }
        }

        if (e.code === 'ArrowDown' || e.code === 'KeyS') {
            if (!isJumping) {
                isDucking = true;
                playerGroup.scale.y = 0.35;
                playerGroup.position.y = 0.1;
                
                if(duckTimeout) clearTimeout(duckTimeout);
                duckTimeout = setTimeout(() => {
                    if(isDucking) cancelDuck();
                }, 650);
            }
        }
    });

    let prevTime = performance.now();
    function animate() {
        requestAnimationFrame(animate);

        const time = performance.now();
        const delta = (time - prevTime) / 1000;
        prevTime = time;

        if (gameActive) {
            // Animação de corrida
            animatePlayer(delta);

            // Interpolação de pista
            playerGroup.position.x += (lanes[currentLane] - playerGroup.position.x) * 0.28;

            // Pulo
            if (isJumping) {
                playerGroup.position.y += velocityY;
                velocityY -= 0.022;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    isJumping = false;
                    velocityY = 0;
                }
            }

            // Gerar obstáculos
            if (Math.floor(time / 10) % 55 === 0) {
                const isHigh = Math.random() > 0.6;
                const obs = isHigh ? createHangingLight() : createChair();
                const lane = lanes[Math.floor(Math.random() * 3)];
                obs.position.set(lane, 0, -85);
                scene.add(obs);
                obstacles.push(obs);
            }

            // Loop de obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                // Checagem de Colisão
                const dx = Math.abs(playerGroup.position.x - obs.position.x);
                const dz = Math.abs(playerGroup.position.z - obs.position.z);
                const dy = playerGroup.position.y + 0.8; // Centro vertical do torso

                // Ajustes finos de colisão
                if (obs.userData.isHigh) {
                    // Colisão com luz de teto (alto)
                    if (dx < 1.4 && dz < 1.1 && !isDucking) {
                        gameOver();
                    }
                } else {
                    // Colisão com cadeira (baixo)
                    // Cadeira é mais compacta no centro
                    if (dx < 0.9 && dz < 0.9) {
                         if (playerGroup.position.y < 1.6) { // Pulo baixo ou em cima da cadeira
                            gameOver();
                         }
                    }
                }

                if (obs.position.z > 15) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('game-ui').innerText = `PONTOS: ${score}`;
                    speed += 0.0006;
                }
            }
        }
        renderer.render(scene, camera);
    }

    function gameOver() {
        gameActive = false;
        document.getElementById('final-score').innerText = `PONTOS: ${score}`;
        document.getElementById('menu-death').classList.remove('hidden');
    }

    init();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
