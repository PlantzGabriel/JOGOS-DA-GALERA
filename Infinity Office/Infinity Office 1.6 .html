<!DOCTYPE html>
<html>
<head>
    <title>Infinity Office</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        /* Telas de Overlay */
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: rgba(0,0,0,0.88); color: white; z-index: 10;
        }
        
        /* Cutscene */
        #cutscene { background: #05050a; z-index: 20; }
        #cutscene-text {
            font-size: 28px; text-align: center; max-width: 70%; line-height: 1.6; 
            opacity: 0; transition: opacity 2s ease-in-out; text-shadow: 2px 2px 4px #000;
            color: #e0e0e0;
        }
        .skip-btn {
            position: absolute; bottom: 30px; font-size: 16px; color: #888; 
            cursor: pointer; animation: pulse 2s infinite; letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        button { 
            padding: 18px 45px; font-size: 22px; cursor: pointer; border: none; 
            border-radius: 8px; background: #00ffaa; color: #000; font-weight: bold; margin: 15px;
            transition: 0.2s; box-shadow: 0 4px 10px rgba(0,255,170,0.3);
        }
        button:hover { transform: scale(1.1); background: #fff; box-shadow: 0 4px 15px rgba(255,255,255,0.4); }
        
        .skin-container { display: flex; gap: 15px; margin-top: 25px; margin-bottom: 25px;}
        .skin-btn { width: 50px; height: 50px; border: 3px solid white; cursor: pointer; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        #game-ui { position: absolute; top: 25px; left: 25px; color: white; font-size: 36px; display: none; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 5;}
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-ui">PONTOS: 0</div>

    <div id="cutscene" class="overlay">
        <p id="cutscene-text">
            "Vc faz parte da maior corporação do mundo, cansado de todo o trabalho exaustivo você decide fugir desse escritório infinito"
        </p>
        <p class="skip-btn" onclick="skipCutscene()">[ CLIQUE PARA PULAR ]</p>
    </div>

    <div id="menu-start" class="overlay hidden">
        <h1 style="letter-spacing: 7px; color: #00ffaa; font-size: 54px; margin-bottom: 5px;">INFINITY OFFICE</h1>
        <p style="margin-top: 0; color: #aaa; margin-bottom: 30px; font-size: 20px;">Corra das cadeiras, abaixe sob as luzes!</p>
        <button onclick="startGame()">INICIAR FUGA</button>
        <p style="color: #eee;">Escolha a cor da sua Roupa:</p>
        <div class="skin-container">
            <div class="skin-btn" style="background: #00d2ff" onclick="changeSkin(0x00d2ff)"></div>
            <div class="skin-btn" style="background: #ff0055" onclick="changeSkin(0xff0055)"></div>
            <div class="skin-btn" style="background: #00ff55" onclick="changeSkin(0x00ff55)"></div>
            <div class="skin-btn" style="background: #ffff00" onclick="changeSkin(0xffff00)"></div>
        </div>
    </div>

    <div id="menu-death" class="overlay hidden">
        <h1 style="color: #ff0055; font-size: 54px;">CAPTURADO PELO RH!</h1>
        <h2 id="final-score" style="color: white; margin-bottom: 40px; font-size: 32px;">PONTOS: 0</h2>
        <button onclick="startGame()">TENTAR DE NOVO</button>
        <button onclick="backToMenu()" style="background: #555; color: white;">MENU PRINCIPAL</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, playerGroup, playerTorso, playerHead, playerLArm, playerRArm, playerLLeg, playerRLeg;
    let obstacles = [];
    let visualElements = []; // Lixos e decorações de parede
    let gameActive = false;
    let score = 0;
    
    // Físicas Escala Gigante (3x maior)
    let speed = 1.8; 
    let velocityY = 0;
    const gravity = 0.07;
    const jumpPower = 1.5;
    let spawnDistanceCounter = 0;

    let currentLane = 1;
    const lanes = [-8.0, 0, 8.0]; 
    let isJumping = false;
    let isDucking = false;
    let playerColor = 0x00d2ff;
    let duckTimeout;
    let runCycle = 0;

    // Lógica da Cutscene
    let cutsceneTimer;
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('cutscene-text').style.opacity = 1;
        }, 500);

        cutsceneTimer = setTimeout(() => {
            skipCutscene();
        }, 10000); // Alterado para 10 segundos
    };

    window.skipCutscene = () => {
        clearTimeout(cutsceneTimer);
        document.getElementById('cutscene').classList.add('hidden');
        document.getElementById('menu-start').classList.remove('hidden');
    };

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x10101a);
        scene.fog = new THREE.Fog(0x10101a, 50, 200);

        // Câmera Imponente
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 25);
        camera.lookAt(0, 6, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light1 = new THREE.DirectionalLight(0xffffff, 2.5);
        light1.position.set(15, 30, 20);
        scene.add(light1, new THREE.AmbientLight(0x707070));

        const light2 = new THREE.DirectionalLight(0xaabbff, 1.0);
        light2.position.set(-15, -5, -15);
        scene.add(light2);

        // Chão de Escritório
        const floorGeo = new THREE.PlaneGeometry(50, 4000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const grid = new THREE.GridHelper(2000, 150, 0x333333, 0x222222);
        grid.position.y = 0.02;
        scene.add(grid);

        // --- PAREDES DE ESCRITÓRIO ---
        const wallGeo = new THREE.BoxGeometry(2, 40, 4000);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 1 }); // Cor Tan/Bege

        const leftWall = new THREE.Mesh(wallGeo, wallMat);
        leftWall.position.set(-20, 20, 0); // Longe o suficiente das pistas
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(wallGeo, wallMat);
        rightWall.position.set(20, 20, 0);
        scene.add(rightWall);

        // --- CONSTRUIR O BONEQUINHO ---
        playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const matHead = new THREE.MeshStandardMaterial({ color: 0xffdbac }); 
        const matSuit = new THREE.MeshStandardMaterial({ color: playerColor }); 
        const matBlack = new THREE.MeshStandardMaterial({ color: 0x111111 });

        playerHead = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.75, 0.6), matHead);
        playerHead.position.set(0, 2.4, 0);
        playerGroup.add(playerHead);

        playerTorso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.52), matSuit);
        playerTorso.position.set(0, 1.65, 0);
        playerGroup.add(playerTorso);

        const armGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.05);
        playerLArm = new THREE.Mesh(armGeo, matHead);
        playerLArm.position.set(-0.67, 1.8, 0);
        playerGroup.add(playerLArm);

        playerRArm = new THREE.Mesh(armGeo, matHead);
        playerRArm.position.set(0.67, 1.8, 0);
        playerGroup.add(playerRArm);

        const legGeo = new THREE.CylinderGeometry(0.18, 0.18, 1.35);
        playerLLeg = new THREE.Mesh(legGeo, matBlack);
        playerLLeg.position.set(-0.3, 0.67, 0);
        playerGroup.add(playerLLeg);

        playerRLeg = new THREE.Mesh(legGeo, matBlack);
        playerRLeg.position.set(0.3, 0.67, 0);
        playerGroup.add(playerRLeg);

        // ESCALA GIGANTE (3x)
        playerGroup.scale.set(3, 3, 3);
        playerGroup.position.set(0, 0, 0);

        animate();
    }

    function animatePlayer(delta) {
        if (!gameActive || isJumping || isDucking) return;

        runCycle += delta * speed * 13; 
        const amplitudeLeg = 0.8;
        const amplitudeArm = 1.0;

        playerLLeg.rotation.x = Math.sin(runCycle) * amplitudeLeg;
        playerRLeg.rotation.x = Math.sin(runCycle + Math.PI) * amplitudeLeg;
        playerLArm.rotation.x = Math.sin(runCycle + Math.PI) * amplitudeArm;
        playerRArm.rotation.x = Math.sin(runCycle) * amplitudeArm;
        playerTorso.rotation.x = Math.sin(runCycle*2) * 0.05; 
    }

    // --- OBSTÁCULOS & VISUAIS ---
    function createChair() {
        const chairGroup = new THREE.Group();
        const matChair = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const matMetal = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 1 });

        const seat = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.22, 1.95), matChair);
        seat.position.set(0, 1.05, 0);
        chairGroup.add(seat);

        const back = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.8, 0.22), matChair);
        back.position.set(0, 1.95, -0.9);
        back.rotation.x = 0.1;
        chairGroup.add(back);

        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.05), matMetal);
        base.position.set(0, 0.52, 0);
        chairGroup.add(base);

        const legGeo = new THREE.CylinderGeometry(0.09, 0.09, 1.2);
        for(let i=0; i<4; i++){
            const leg = new THREE.Mesh(legGeo, matMetal);
            leg.position.set(i<2?0.45:-0.45, 0.22, i%2==0?0.45:-0.45);
            leg.rotation.y = Math.PI / 4;
            chairGroup.add(leg);
        }

        chairGroup.userData = { isHigh: false };
        chairGroup.scale.set(3, 3, 3);
        return chairGroup;
    }

    function createHangingLight() {
        const lightGroup = new THREE.Group();
        const matLight = new THREE.MeshStandardMaterial({ color: 0xcccccc, emissive: 0xffffff, emissiveIntensity: 1 });
        const matWire = new THREE.MeshStandardMaterial({ color: 0x333333 });

        const lightFixture = new THREE.Mesh(new THREE.BoxGeometry(6, 0.37, 1.5), matLight);
        lightFixture.position.set(0, 3.5, 0); // Altura crítica para abaixar
        lightFixture.rotation.set((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2);
        lightGroup.add(lightFixture);

        const wireGeo = new THREE.CylinderGeometry(0.03, 0.03, 10);
        const wire1 = new THREE.Mesh(wireGeo, matWire);
        wire1.position.set(-2.7, 8.4, 0);
        lightGroup.add(wire1);
        const wire2 = new THREE.Mesh(wireGeo, matWire);
        wire2.position.set(2.7, 8.4, 0);
        lightGroup.add(wire2);

        lightGroup.userData = { isHigh: true };
        lightGroup.scale.set(3, 3, 3);
        return lightGroup;
    }

    // --- NOVOS: VISUAIS ---
    function createFloorTrash() {
        const isCan = Math.random() > 0.5;
        const mat = new THREE.MeshStandardMaterial({ 
            color: isCan ? 0xff3333 : 0xeeeeee, 
            metalness: isCan ? 0.7 : 0,
            roughness: isCan ? 0.3 : 1
        });
        const geo = isCan ? new THREE.CylinderGeometry(0.12, 0.12, 0.4) : new THREE.IcosahedronGeometry(0.2, 0);
        const trash = new THREE.Mesh(geo, mat);
        if(isCan) trash.rotation.z = Math.PI / 2;
        trash.scale.set(3,3,3);
        const lane = lanes[Math.floor(Math.random() * 3)];
        // Posicionamento aleatório na pista
        trash.position.set(lane + (Math.random()-0.5)*5, 0.7, -250); 
        return trash;
    }

    function createWallDecoration(isOnRight) {
        const isDoor = Math.random() > 0.6; // Mais quadros que portas
        const group = new THREE.Group();
        
        if (isDoor) {
            // Porta simples de madeira
            const matWood = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 1 });
            const matHandle = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 1 });
            const door = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 4), matWood);
            group.add(door);
            const handle = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.2), matHandle);
            handle.position.set(isOnRight?-0.55:0.55, 0, 1.5); // Maçaneta pro lado certo
            group.add(handle);
            group.scale.set(3,3,3);
            group.position.set(isOnRight?18.5:-18.5, 12, -250);
        } else {
            // Quadro aleatório
            const matFrame = new THREE.MeshStandardMaterial({ color: Math.random()*0xffffff, roughness: 0.7 });
            const matArt = new THREE.MeshStandardMaterial({ 
                color: new THREE.Color(Math.random(), Math.random(), Math.random()), 
                emissive: 0xffffff, emissiveIntensity: 0.1 
            });
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 3), matFrame);
            group.add(frame);
            const art = new THREE.Mesh(new THREE.BoxGeometry(0.51, 3.5, 2.5), matArt);
            group.add(art);
            group.scale.set(3,3,3);
            group.position.set(isOnRight?19.2:-19.2, 18, -250); // Mais alto que a porta
        }
        return group;
    }

    function cancelDuck() {
        isDucking = false;
        playerGroup.scale.set(3, 3, 3); 
        playerGroup.position.y = isJumping ? playerGroup.position.y : 0;
        if(duckTimeout) clearTimeout(duckTimeout);
    }

    window.startGame = () => {
        score = 0;
        speed = 1.8; 
        currentLane = 1;
        spawnDistanceCounter = 0;
        obstacles.forEach(o => scene.remove(o));
        obstacles = [];
        visualElements.forEach(o => scene.remove(o));
        visualElements = [];
        gameActive = true;
        document.getElementById('game-ui').innerText = "PONTOS: 0";
        document.getElementById('menu-start').classList.add('hidden');
        document.getElementById('menu-death').classList.add('hidden');
        document.getElementById('game-ui').style.display = 'block';
    };

    window.backToMenu = () => {
        document.getElementById('menu-death').classList.add('hidden');
        document.getElementById('menu-start').classList.remove('hidden');
        document.getElementById('game-ui').style.display = 'none';
    };

    window.changeSkin = (color) => {
        playerColor = color;
        playerTorso.material.color.setHex(color);
        playerHead.material.color.setHex(color); 
    };

    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;

        if (e.code === 'ArrowLeft' && currentLane > 0) currentLane--;
        if (e.code === 'ArrowRight' && currentLane < 2) currentLane++;

        if (e.code === 'ArrowUp' || e.code === 'Space') {
            if (!isJumping) {
                if (isDucking) cancelDuck();
                velocityY = jumpPower;
                isJumping = true;
                playerLLeg.rotation.x = -0.6;
                playerRLeg.rotation.x = 0.4;
            }
        }

        if (e.code === 'ArrowDown' || e.code === 'KeyS') {
            if (!isJumping) {
                isDucking = true;
                playerGroup.scale.set(3, 1.2, 3); 
                
                if(duckTimeout) clearTimeout(duckTimeout);
                duckTimeout = setTimeout(() => {
                    if(isDucking) cancelDuck();
                }, 650);
            }
        }
    });

    let prevTime = performance.now();
    function animate() {
        requestAnimationFrame(animate);

        const time = performance.now();
        const delta = (time - prevTime) / 1000;
        prevTime = time;

        if (gameActive) {
            animatePlayer(delta);

            // Transição de pista (Lerp)
            playerGroup.position.x += (lanes[currentLane] - playerGroup.position.x) * 0.28;

            // Física do Pulo
            if (isJumping) {
                playerGroup.position.y += velocityY;
                velocityY -= gravity;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    isJumping = false;
                    velocityY = 0;
                }
            }

            // --- SPAWN CONFIÁVEL DE OBSTÁCULOS E VISUAIS ---
            spawnDistanceCounter -= speed;
            if (spawnDistanceCounter <= 0) {
                // Obstáculo Real
                const isHangingLight = Math.random() > 0.6;
                const obs = isHangingLight ? createHangingLight() : createChair();
                const lane = lanes[Math.floor(Math.random() * 3)];
                obs.position.set(lane, 0, -250); 
                scene.add(obs);
                obstacles.push(obs);
                
                // Lixo no Chão (Visual)
                const trash = createFloorTrash();
                scene.add(trash);
                visualElements.push(trash);

                // Decoração de Parede (Visual)
                const isRight = Math.random() > 0.5;
                const decor = createWallDecoration(isRight);
                scene.add(decor);
                visualElements.push(decor);

                spawnDistanceCounter = 80; // Distância fixa entre ondas
            }

            // Mover Visual Elements (Não têm colisão)
            for (let i = visualElements.length - 1; i >= 0; i--) {
                const element = visualElements[i];
                element.position.z += speed;
                if (element.position.z > 40) {
                    scene.remove(element);
                    visualElements.splice(i, 1);
                }
            }

            // Mover e Checar Colisão de Obstáculos Reais
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                const dx = Math.abs(playerGroup.position.x - obs.position.x);
                const dz = Math.abs(playerGroup.position.z - obs.position.z);

                // Colisão adaptada para a escala 3x
                if (obs.userData.isHigh) {
                    // Luz de Teto pendurada (Alto)
                    if (dx < 5.0 && dz < 4.0 && !isDucking) gameOver();
                } else {
                    // Cadeira (Baixo)
                    if (dx < 3.5 && dz < 3.5) {
                         if (playerGroup.position.y < 6.0) gameOver(); // Exige pular alto
                    }
                }

                if (obs.position.z > 40) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('game-ui').innerText = `PONTOS: ${score}`;
                    speed += 0.002; // Acelera
                }
            }
        }
        renderer.render(scene, camera);
    }

    function gameOver() {
        gameActive = false;
        document.getElementById('final-score').innerText = `PONTOS: ${score}`;
        document.getElementById('menu-death').classList.remove('hidden');
    }

    init();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
