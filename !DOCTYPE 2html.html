<!DOCTYPE html>
<html lang="pt-pt">
<head>
<meta charset="UTF-8">
<title>ULTRA BHOP: NEON GRAPPLE EDITION</title>
<style>
    body { margin:0; overflow:hidden; background:#000; color:#0ff; font-family:'Courier New', monospace; user-select:none; }
    
    #ui { position:fixed; top:10px; left:10px; z-index:99; pointer-events:none; }
    .btn { background:#001a33; border:1px solid #0ff; color:#0ff; margin:2px; padding:8px 12px; cursor:pointer; pointer-events:auto; text-transform:uppercase; font-weight:bold; transition: 0.2s; }
    .btn:hover { background:#0ff; color:#000; box-shadow: 0 0 10px #0ff; }
    
    #hud { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); color:white; text-align:center; pointer-events:none; }
    #speed { font-size:48px; font-weight:900; text-shadow:0 0 15px #0ff; letter-spacing: 2px; transition: color 0.1s; }
    #timer { font-size:24px; opacity:.9; margin-top:5px; }
    #state-text { font-size:20px; color:#ff00ff; font-weight:bold; margin-top:5px; text-shadow:0 0 10px #ff00ff; height: 24px; }
    
    #cooldowns { position: fixed; right: 20px; bottom: 30px; text-align: right; font-size: 18px; }
    .bar-bg { width: 150px; height: 10px; background: #222; border: 1px solid #0ff; float: right; clear: both; margin-top: 5px; position: relative;}
    .bar-fill { height: 100%; background: #0ff; width: 100%; transition: width 0.1s; }
    
    #start-menu { position:fixed; inset:0; background:rgba(0,5,15,0.95); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; }
    #start-menu h1 { font-size:5rem; text-shadow:0 0 30px #0ff, 0 0 10px #ff00ff; margin-bottom: 0; color: #fff; }
    .controls { color: #aaa; margin: 30px 0; text-align: center; line-height: 1.8; font-size: 18px; }
    .controls span { color: #0ff; font-weight: bold; }
    
    #crosshair { position:fixed; top:50%; left:50%; width:6px; height:6px; background:#fff; transform:translate(-50%, -50%); border-radius:50%; pointer-events:none; z-index:50; box-shadow: 0 0 10px #0ff; mix-blend-mode: difference; }
</style>
</head>
<body>

<div id="crosshair"></div>

<div id="start-menu">
    <h1>CYBER BHOP</h1>
    <div class="controls">
        <span>[W A S D]</span> Mover | <span>[ESPAÇO]</span> Saltar / Walljump<br>
        <span>[M1 Rato]</span> Olhar | <span>[M2 Botão Dto]</span> Grappling Hook<br>
        <span>[E]</span> Dash | Corra contra paredes para <span>Wallrun</span>
    </div>
    <button class="btn" id="btn-start" style="font-size:24px; padding:15px 40px; border-width: 2px;">INICIAR RUN</button>
</div>

<div id="ui">
    <button class="btn" onclick="respawn()">Respawn (P)</button>
</div>

<div id="cooldowns">
    Dash<div class="bar-bg"><div id="dash-bar" class="bar-fill"></div></div>
</div>

<div id="hud">
    <div id="speed">0 UPS</div>
    <div id="state-text"></div>
    <div id="timer">00.000</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ==========================================
// 1. MOTOR E AMBIENTE THREE.JS
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050011);
scene.fog = new THREE.FogExp2(0x050011, 0.008);

const camera = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x442266, 0.6));
const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
dirLight.position.set(50, 100, 50);
scene.add(dirLight);

// Grelha Cyberpunk de fundo
const gridHelper = new THREE.GridHelper(1000, 100, 0xff00ff, 0x220044);
gridHelper.position.y = -60;
scene.add(gridHelper);

// ==========================================
// 2. JOGADOR E FÍSICA
// ==========================================
const player = {
    pos: new THREE.Vector3(0, 5, 0),
    vel: new THREE.Vector3(),
    wishdir: new THREE.Vector3(),
    onGround: false,
    isWallrunning: false,
    wallDir: null, // De que lado está a parede
    radius: 0.6,
    height: 2.0,
    
    gravity: 28,
    friction: 7,
    accelGround: 15,
    accelAir: 160, 
    maxSpeed: 14,
    jumpForce: 10,
    
    lastDash: 0,
    dashCooldown: 1.5,
    mouseSense: 1.5
};

let yaw = Math.PI, pitch = 0;
const keys = {};
let jumpQueued = false;
let gameState = "MENU";

// Grappling Hook
let hookPoint = null;
const hookMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 });
const hookGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const hookLine = new THREE.Line(hookGeo, hookMat);
hookLine.visible = false;
scene.add(hookLine);

const raycaster = new THREE.Raycaster();
const centerScreen = new THREE.Vector2(0, 0);

// ==========================================
// 3. MAPA: ESTÉTICA NEON GRID
// ==========================================
const platforms = [];

function createNeonBlock(x, y, z, w, h, d, isBounce = false) {
    const geo = new THREE.BoxGeometry(w, h, d);
    // Material escuro
    const mat = new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.1 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    
    // Grelha de bordas néon
    const edges = new THREE.EdgesGeometry(geo);
    const lineMat = new THREE.LineBasicMaterial({ color: isBounce ? 0xffaa00 : 0x00ffff });
    const lines = new THREE.LineSegments(edges, lineMat);
    mesh.add(lines);
    
    scene.add(mesh);
    platforms.push({ mesh, box: new THREE.Box3(), isBounce });
}

function buildMap() {
    createNeonBlock(0, 0, 0, 20, 2, 20); // Spawn
    createNeonBlock(0, 0, -40, 10, 2, 10);
    
    // Zona de Wallrun
    createNeonBlock(-10, 10, -80, 2, 15, 40); // Parede Esquerda
    createNeonBlock(10, 5, -110, 2, 15, 40);  // Parede Direita
    
    // Zona de Grappling
    createNeonBlock(0, 30, -170, 4, 4, 4); // Ponto de gancho alto no ar
    createNeonBlock(0, 0, -220, 20, 2, 20); // Plataforma de aterragem
    
    // Jump Pad
    createNeonBlock(0, -2, -250, 6, 1, 6, true);
    createNeonBlock(0, 40, -320, 20, 2, 20); // Final
}
buildMap();

// ==========================================
// 4. FÍSICA E RESOLUÇÃO AABB (COM WALLRUN)
// ==========================================
function accelerate(wishdir, accel, max_velocity, dt) {
    let current_speed = player.vel.dot(wishdir);
    let add_speed = max_velocity - current_speed;
    if (add_speed <= 0) return;
    let accel_speed = accel * dt * max_velocity;
    player.vel.addScaledVector(wishdir, Math.min(accel_speed, add_speed));
}

function resolveCollisions() {
    let wasOnGround = player.onGround;
    player.onGround = false;
    player.isWallrunning = false;
    player.wallDir = null;
    
    const halfH = player.height / 2;

    platforms.forEach(p => {
        p.box.setFromObject(p.mesh);
        const b = p.box;

        if (player.pos.x + player.radius > b.min.x && player.pos.x - player.radius < b.max.x &&
            player.pos.z + player.radius > b.min.z && player.pos.z - player.radius < b.max.z &&
            player.pos.y + halfH > b.min.y && player.pos.y - halfH < b.max.y) {
            
            let dx1 = b.max.x - (player.pos.x - player.radius); // Dir
            let dx2 = (player.pos.x + player.radius) - b.min.x; // Esq
            let dz1 = b.max.z - (player.pos.z - player.radius); // Frente
            let dz2 = (player.pos.z + player.radius) - b.min.z; // Trás
            let dy1 = b.max.y - (player.pos.y - halfH); // Chão
            let dy2 = (player.pos.y + halfH) - b.min.y; // Teto

            let minOverlap = Math.min(dx1, dx2, dz1, dz2, dy1, dy2);

            if (minOverlap === dy1 && player.vel.y <= 0) {
                player.pos.y = b.max.y + halfH;
                player.vel.y = 0;
                player.onGround = true;
                if(p.isBounce) player.vel.y = player.jumpForce * 2.5; // Jump pad
            } 
            else if (minOverlap === dy2 && player.vel.y > 0) {
                player.pos.y = b.min.y - halfH; player.vel.y = -1; 
            } 
            else {
                // É UMA PAREDE (Wallrun Logic)
                if(!player.onGround && player.vel.y < 5) {
                    player.isWallrunning = true;
                }
                
                if (minOverlap === dx1) { player.pos.x = b.max.x + player.radius; player.vel.x = 0; player.wallDir = 'right'; }
                else if (minOverlap === dx2) { player.pos.x = b.min.x - player.radius; player.vel.x = 0; player.wallDir = 'left';}
                else if (minOverlap === dz1) { player.pos.z = b.max.z + player.radius; player.vel.z = 0; player.wallDir = 'front';}
                else if (minOverlap === dz2) { player.pos.z = b.min.z - player.radius; player.vel.z = 0; player.wallDir = 'back';}
            }
        }
    });
}

function updatePhysics(dt) {
    let forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).negate();
    let right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), forward);
    
    player.wishdir.set(0, 0, 0);
    if (keys.KeyW) player.wishdir.add(forward);
    if (keys.KeyS) player.wishdir.sub(forward);
    if (keys.KeyA) player.wishdir.add(right);
    if (keys.KeyD) player.wishdir.sub(right);
    if (player.wishdir.lengthSq() > 0) player.wishdir.normalize();

    // Lógica do Grappling Hook
    if (hookPoint) {
        let pullDir = new THREE.Vector3().subVectors(hookPoint, player.pos).normalize();
        let dist = player.pos.distanceTo(hookPoint);
        
        // Puxar o jogador. Mais força se estiver mais longe.
        player.vel.add(pullDir.multiplyScalar(40 * dt));
        
        // Atualizar visual do cabo
        hookGeo.setPositions([player.pos.x, player.pos.y - 0.5, player.pos.z, hookPoint.x, hookPoint.y, hookPoint.z]);
        hookLine.visible = true;
        
        if (dist < 3) hookPoint = null; // Larga se chegar muito perto
    } else {
        hookLine.visible = false;
    }

    if (player.onGround) {
        let speed = player.vel.length();
        if (speed > 0) {
            let drop = speed * player.friction * dt;
            player.vel.multiplyScalar(Math.max(speed - drop, 0) / speed);
        }
        accelerate(player.wishdir, player.accelGround, player.maxSpeed, dt);
        
        if (jumpQueued) {
            player.vel.y = player.jumpForce;
            player.onGround = false;
        }
    } else {
        accelerate(player.wishdir, player.accelAir, 2.0, dt); 
    }

    // Aplicação de Gravidade (Reduzida se Wallrunning)
    if (player.isWallrunning) {
        player.vel.y -= (player.gravity * 0.2) * dt; // Escorrega mais devagar
        if (jumpQueued) {
            // Walljump: atira o jogador para longe da parede e para cima
            player.vel.y = player.jumpForce * 1.2;
            let bounceDir = new THREE.Vector3();
            if(player.wallDir === 'right') bounceDir.set(-1,0,0);
            if(player.wallDir === 'left') bounceDir.set(1,0,0);
            if(player.wallDir === 'front') bounceDir.set(0,0,-1);
            if(player.wallDir === 'back') bounceDir.set(0,0,1);
            player.vel.add(bounceDir.multiplyScalar(15));
        }
    } else {
        player.vel.y -= player.gravity * dt;
    }

    player.pos.addScaledVector(player.vel, dt);
    resolveCollisions();
    
    if (player.pos.y < -70) respawn();
    jumpQueued = false;
}

// ==========================================
// 5. CONTROLOS E EVENTOS
// ==========================================
window.addEventListener("keydown", e => { 
    keys[e.code] = true; 
    if(e.code === "Space") { jumpQueued = true; e.preventDefault(); }
    if(e.code === "KeyP") respawn();
    
    // Dash (E ou Shift)
    if((e.code === "KeyE" || e.code === "ShiftLeft") && gameState === "PLAYING") {
        let now = performance.now() / 1000;
        if(now - player.lastDash >= player.dashCooldown) {
            player.lastDash = now;
            let dashDir = player.wishdir.length() > 0 ? player.wishdir.clone() : new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).negate();
            player.vel.add(dashDir.multiplyScalar(25));
            if(!player.onGround) player.vel.y += 5; // Ajuda a manter a altura no ar
        }
    }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// Controlos do Rato
document.addEventListener("mousemove", e => {
    if (document.pointerLockElement === document.body) {
        yaw -= e.movementX * 0.002 * player.mouseSense;
        pitch -= e.movementY * 0.002 * player.mouseSense;
        pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
    }
});

// Grappling Hook (Botão Direito)
document.addEventListener("mousedown", e => {
    if(document.pointerLockElement !== document.body) return;
    if(e.button === 2) { // Botão direito
        raycaster.setFromCamera(centerScreen, camera);
        const meshes = platforms.map(p => p.mesh);
        const hits = raycaster.intersectObjects(meshes);
        if(hits.length > 0 && hits[0].distance < 150) {
            hookPoint = hits[0].point;
        }
    }
});
document.addEventListener("mouseup", e => { if(e.button === 2) hookPoint = null; });
document.addEventListener("contextmenu", e => e.preventDefault()); // Impede o menu do browser

document.getElementById("btn-start").onclick = () => {
    document.getElementById("start-menu").style.display = "none";
    document.body.requestPointerLock();
    gameState = "PLAYING";
    respawn();
};

let startTime = 0;
function respawn() {
    player.pos.set(0, 5, 0);
    player.vel.set(0, 0, 0);
    yaw = Math.PI; pitch = 0;
    hookPoint = null;
    startTime = performance.now();
}

// ==========================================
// 6. LOOP PRINCIPAL
// ==========================================
let lastTime = performance.now();

function loop() {
    requestAnimationFrame(loop);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    if(gameState === "PLAYING" && document.pointerLockElement === document.body) {
        updatePhysics(dt);
        
        // Atualiza a Câmara
        // Efeito de Tilt (inclinar) durante Wallrun
        let targetTilt = 0;
        if(player.isWallrunning) {
            targetTilt = (player.wallDir === 'right') ? -0.2 : (player.wallDir === 'left') ? 0.2 : 0;
        }
        camera.rotation.set(pitch, yaw, targetTilt, 'YXZ');
        camera.position.set(player.pos.x, player.pos.y + (player.height/2) - 0.2, player.pos.z);

        // UI & Efeitos Visuais
        let speed = Math.hypot(player.vel.x, player.vel.z);
        camera.fov = THREE.MathUtils.lerp(camera.fov, 90 + Math.min(speed, 40), dt * 5);
        camera.updateProjectionMatrix();

        const speedUI = document.getElementById("speed");
        speedUI.innerText = Math.floor(speed * 100) + " UPS";
        speedUI.style.color = speed > 30 ? "#f0f" : speed > 15 ? "#0f0" : "#0ff";
        
        let stateTxt = "";
        if(hookPoint) stateTxt = ">> GRAPPLING <<";
        else if(player.isWallrunning) stateTxt = "|| WALLRUN ||";
        document.getElementById("state-text").innerText = stateTxt;

        document.getElementById("timer").innerText = ((now - startTime) / 1000).toFixed(3) + "s";
        
        // UI do Dash
        let dashRatio = Math.min(((now/1000) - player.lastDash) / player.dashCooldown, 1.0);
        document.getElementById("dash-bar").style.width = (dashRatio * 100) + "%";
        document.getElementById("dash-bar").style.background = dashRatio >= 1 ? "#0ff" : "#f00";
    }

    renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
</body>
</html>
