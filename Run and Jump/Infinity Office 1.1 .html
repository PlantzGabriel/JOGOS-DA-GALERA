<!DOCTYPE html>
<html>
<head>
    <title>Runner 3D Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #instructions { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; font-size: 18px; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>
    <div id="ui">PONTOS: 0</div>
    <div id="instructions">Setas: Mover / Cima: Pular / Baixo: Abaixar</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

<script type="module">
    import * as THREE from 'three';

    // --- CENA E RENDERER ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 10, 60); // Efeito de neblina no fundo

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luzes
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(5, 10, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // --- MUNDO ---
    const lanes = [-2, 0, 2];
    let currentLane = 1; // Começa no meio (índice 1)

    // Chão
    const floorGeo = new THREE.PlaneGeometry(8, 1000);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Jogador
    const playerGeo = new THREE.BoxGeometry(1, 1, 1);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x00d2ff });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(lanes[currentLane], 0.5, 0);
    scene.add(player);

    // Variáveis
    let score = 0;
    let gameSpeed = 0.3;
    let velocityY = 0;
    let isJumping = false;
    let isDucking = false;
    const obstacles = [];

    // Câmera posicionada
    camera.position.set(0, 4, 6);
    camera.lookAt(0, 0, -5);

    // --- LOGICA ---

    function spawnObstacle() {
        const lane = lanes[Math.floor(Math.random() * 3)];
        const isHigh = Math.random() > 0.7; // 30% de chance de ser obstáculo alto
        
        let obsGeo, obsMat, yPos;
        
        if (isHigh) {
            obsGeo = new THREE.BoxGeometry(1.5, 0.5, 1); // Obstáculo "teto"
            obsMat = new THREE.MeshStandardMaterial({ color: 0xffea00 });
            yPos = 2.2; // Altura que exige abaixar
        } else {
            obsGeo = new THREE.BoxGeometry(1.2, 1.2, 1); // Bloco normal
            obsMat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
            yPos = 0.6;
        }

        const obs = new THREE.Mesh(obsGeo, obsMat);
        obs.userData = { isHigh }; // Guarda se é alto ou não
        obs.position.set(lane, yPos, -60);
        scene.add(obs);
        obstacles.push(obs);
    }

    // Controles
    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' && currentLane > 0) currentLane--;
        if (e.code === 'ArrowRight' && currentLane < 2) currentLane++;
        if (e.code === 'ArrowUp' || e.code === 'Space') {
            if (!isJumping && !isDucking) {
                velocityY = 0.25;
                isJumping = true;
            }
        }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') {
            if (!isJumping) {
                isDucking = true;
                player.scale.y = 0.4;
                player.position.y = 0.2;
                setTimeout(() => { // Volta ao normal depois de 600ms
                    isDucking = false;
                    player.scale.y = 1;
                    player.position.y = 0.5;
                }, 600);
            }
        }
    });

    function animate() {
        requestAnimationFrame(animate);

        // Suavizar movimento lateral (Lerp)
        player.position.x += (lanes[currentLane] - player.position.x) * 0.15;

        // Gravidade/Pulo
        if (isJumping) {
            player.position.y += velocityY;
            velocityY -= 0.012;
            if (player.position.y <= 0.5) {
                player.position.y = 0.5;
                isJumping = false;
            }
        }

        // Criar obstáculos aleatórios
        if (Math.random() < 0.03) spawnObstacle();

        // Movimentar e checar colisão
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.position.z += gameSpeed;

            // Box de colisão simples
            const dx = Math.abs(player.position.x - obs.position.x);
            const dy = Math.abs(player.position.y - obs.position.y);
            const dz = Math.abs(player.position.z - obs.position.z);

            // Se bater (Ajustado para o tamanho dos modelos)
            if (dx < 0.8 && dz < 0.8) {
                if (obs.userData.isHigh) {
                    // Colisão com obstáculo alto (só morre se NÃO estiver abaixado)
                    if (!isDucking) gameOver();
                } else {
                    // Colisão com bloco normal (morre se estiver no chão ou pular nele)
                    gameOver();
                }
            }

            // Limpeza
            if (obs.position.z > 10) {
                scene.remove(obs);
                obstacles.splice(i, 1);
                score += 10;
                document.getElementById('ui').innerText = `PONTOS: ${score}`;
                gameSpeed += 0.0002;
            }
        }

        renderer.render(scene, camera);
    }

    function gameOver() {
        alert(`Fim de jogo! Pontuação: ${score}`);
        location.reload();
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
