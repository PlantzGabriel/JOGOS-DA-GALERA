<!DOCTYPE html>
<html>
<head>
    <title>Corrida Infinita 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Pontos: 0</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

<script type="module">
    import * as THREE from 'three';

    // --- CONFIGURAÇÃO BÁSICA ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Céu azul
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luzes
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7.5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // --- OBJETOS ---
    // Chão (Pista)
    const floorGeo = new THREE.PlaneGeometry(10, 1000);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Jogador (Cubo)
    const playerGeo = new THREE.BoxGeometry(1, 1, 1);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.y = 0.5;
    scene.add(player);

    // Variáveis de controle
    let score = 0;
    let speed = 0.2;
    let velocityY = 0;
    let isJumping = false;
    const obstacles = [];

    // Câmera
    camera.position.set(0, 3, 7);
    camera.lookAt(player.position);

    // --- FUNÇÕES ---
    function spawnObstacle() {
        const obsGeo = new THREE.BoxGeometry(1, Math.random() * 1.5 + 0.5, 1);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        const obs = new THREE.Mesh(obsGeo, obsMat);
        obs.position.set((Math.random() - 0.5) * 4, obs.geometry.parameters.height / 2, -50);
        scene.add(obs);
        obstacles.push(obs);
    }

    function jump() {
        if (!isJumping) {
            velocityY = 0.2;
            isJumping = true;
        }
    }

    // Input
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') jump();
        if (e.code === 'ArrowLeft') player.position.x -= 0.5;
        if (e.code === 'ArrowRight') player.position.x += 0.5;
    });

    // Loop de Animação
    function animate() {
        requestAnimationFrame(animate);

        // Física do Pulo
        if (isJumping) {
            player.position.y += velocityY;
            velocityY -= 0.01; // Gravidade
            if (player.position.y <= 0.5) {
                player.position.y = 0.5;
                isJumping = false;
            }
        }

        // Movimentar Obstáculos
        if (Math.random() < 0.02) spawnObstacle();

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].position.z += speed;

            // Colisão simples por distância
            if (player.position.distanceTo(obstacles[i].position) < 1.2) {
                location.reload(); // Reinicia se bater
            }

            // Remover se passar do jogador
            if (obstacles[i].position.z > 10) {
                scene.remove(obstacles[i]);
                obstacles.splice(i, 1);
                score++;
                document.getElementById('ui').innerText = `Pontos: ${score}`;
                speed += 0.0005; // Fica mais rápido
            }
        }

        renderer.render(scene, camera);
    }

    animate();

    // Ajuste de tela
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
