<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monster Masters - Repel & Creative Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap');
        :root { --bg-dark: #0f172a; --panel-bg: rgba(30, 41, 59, 0.9); --primary: #fbbf24; --text-light: #f8fafc; --text-muted: #94a3b8; --hp-green: #10b981; --hp-yellow: #f59e0b; --hp-red: #ef4444; --xp-blue: #3b82f6; }
        * { box-sizing: border-box; user-select: none; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Inter', sans-serif; color: var(--text-light); overflow: hidden; }
        h1, h2, h3, .retro-text { font-family: 'Press Start 2P', cursive; }
        
        /* Overlays & UI */
        .overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .overlay h2 { color: var(--primary); text-shadow: 0 4px 10px rgba(251, 191, 36, 0.5); margin-bottom: 30px; }
        .card-grid { display: flex; flex-wrap: wrap; gap: 15px; max-width: 800px; justify-content: center; }
        .card { background: rgba(30, 41, 59, 0.8); border: 2px solid #334155; padding: 20px; cursor: pointer; text-align: center; width: 220px; border-radius: 12px; transition: 0.2s; }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .stat-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; font-family: 'Press Start 2P'; }
        
        /* World */
        #game-wrapper { display: flex; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 12px; overflow: hidden; background: var(--bg-dark); position: relative; }
        #game-container { position: relative; width: 720px; height: 540px; background: #2d5a27; overflow: hidden; }
        #world { position: absolute; width: 2000px; height: 2000px; background-image: radial-gradient(#3d7a35 15%, transparent 16%), radial-gradient(#3d7a35 15%, transparent 16%); background-size: 40px 40px; background-position: 0 0, 20px 20px; transition: transform 0.15s linear; }
        .biome { position: absolute; opacity: 0.6; border-radius: 20px; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); }
        .biome-grass { background: #166534; background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #14532d 10px, #14532d 20px); }
        .biome-water { background: #0284c7; background-image: radial-gradient(circle, #0ea5e9 10%, transparent 20%); background-size: 30px 30px; }
        .biome-volcano { background: #7f1d1d; background-image: radial-gradient(circle, #991b1b 20%, transparent 20%); background-size: 40px 40px; }
        .heal-center { position: absolute; width: 160px; height: 160px; background: #f8fafc; border-radius: 16px; border: 4px solid #ef4444; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
        .heal-center::before { content: "+"; color: #ef4444; font-size: 60px; font-weight: bold; }
        #player { position: absolute; width: 32px; height: 32px; background: var(--primary); border: 3px solid #fff; z-index: 100; border-radius: 50%; transition: top 0.15s linear, left 0.15s linear; box-shadow: 0 5px 10px rgba(0,0,0,0.5); }
        
        /* Battle */
        #battle-screen { position: absolute; inset: 0; z-index: 500; display: none; background: linear-gradient(to bottom, #1e293b, #0f172a); flex-direction: column; }
        .ui-box { position: absolute; background: rgba(15, 23, 42, 0.85); border: 2px solid #334155; padding: 12px 16px; border-radius: 12px; width: 280px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        #en-ui { top: 30px; left: 30px; } #pl-ui { bottom: 180px; right: 30px; }
        .name-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        .name-row span { font-family: 'Press Start 2P'; font-size: 11px; }
        .lvl-text { font-family: 'Inter', sans-serif !important; font-weight: 800; color: var(--primary); font-size: 13px !important;}
        .shiny-icon { color: #fbbf24; margin-left: 5px; font-family: 'Inter'; }
        
        .bar-bg { height: 10px; background: #000; border-radius: 5px; border: 1px solid #333; margin-bottom: 4px; overflow: hidden; }
        .hp-fill { height: 100%; transition: width 0.4s ease, background 0.4s ease; }
        .xp-fill { height: 4px; background: var(--xp-blue); transition: width 0.4s ease; }
        
        .sprite { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: float 3s ease-in-out infinite; transition: filter 0.3s; }
        #en-sprite { top: 50px; right: 80px; animation-delay: -1.5s; } #pl-sprite { bottom: 200px; left: 80px; }
        
        /* Animações de Batalha */
        @keyframes atk-pl { 0%, 100% {transform: translate(0,0)} 50% {transform: translate(40px, -40px) scale(1.1)} }
        @keyframes atk-en { 0%, 100% {transform: translate(0,0)} 50% {transform: translate(-40px, 40px) scale(1.1)} }
        @keyframes shake { 0%, 100% {transform: translateX(0)} 25% {transform: translateX(-10px)} 75% {transform: translateX(10px)} }
        .anim-atk-pl { animation: atk-pl 0.3s ease-in-out !important; }
        .anim-atk-en { animation: atk-en 0.3s ease-in-out !important; }
        .anim-hit { animation: shake 0.2s ease-in-out infinite !important; }

        .fct { position: absolute; font-family: 'Press Start 2P'; font-size: 18px; text-shadow: 2px 2px 0 #000; z-index: 1000; animation: fctAnim 1s forwards; pointer-events: none; }
        @keyframes fctAnim { 0% { opacity: 0; transform: translateY(0) scale(0.5); } 20% { opacity: 1; transform: translateY(-20px) scale(1.2); } 100% { opacity: 0; transform: translateY(-60px) scale(1); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        /* Controles */
        #controls { position: absolute; bottom: 0; width: 100%; height: 150px; background: #0f172a; border-top: 2px solid #334155; display: flex; }
        #msg { flex: 1; padding: 20px; font-size: 16px; font-weight: 600; line-height: 1.5; border-right: 2px solid #334155; }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; width: 380px; }
        button { background: #1e293b; color: #fff; border: 2px solid #334155; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.1s; }
        button:hover:not(:disabled) { background: #334155; border-color: var(--primary); }
        button:active:not(:disabled) { transform: scale(0.95); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .move-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; }
        .move-type { font-size: 9px; padding: 2px 6px; border-radius: 4px; color: #000; font-weight: 800; text-transform: uppercase;}
        .move-pp { font-size: 10px; color: var(--text-muted); }
        
        /* Painel Lateral */
        #side { width: 250px; background: var(--panel-bg); border-left: 2px solid #334155; padding: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 1500;}
        .side-btn { padding: 10px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .mini-card { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; font-weight: 600; font-size: 12px; display: flex; flex-direction: column; gap: 5px; border-left: 4px solid gray; }
        .mini-hp-bar { height: 4px; background: #333; border-radius: 2px; width: 100%; }
        .mini-hp-fill { height: 100%; background: var(--hp-green); width: 100%; }
        
        .sys-msg { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; font-weight: bold; color: var(--primary); z-index: 3000; display: none; border: 1px solid var(--primary); transition: 0.3s; }
        .back-btn { background: #7f1d1d !important; border-color: #991b1b !important; }
        .back-btn:hover { background: #991b1b !important; }
        
        #repel-status { color: #38bdf8; font-size: 11px; text-align: center; font-weight: bold; display: none; }
        #creative-status { color: #fbbf24; font-size: 11px; text-align: center; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div id="sys-notification" class="sys-msg">Jogo Salvo!</div>
<div id="start-overlay" class="overlay">
    <h2>ESCOLHA SEU PARCEIRO</h2>
    <div id="starter-list" class="card-grid"></div>
</div>

<div id="game-wrapper">
    <div id="game-container">
        <div id="world"><div id="biomes-container"></div><div class="heal-center" style="top: 920px; left: 920px;"></div><div id="player" style="top:1000px; left:1000px;"></div></div>

        <div id="battle-screen">
            <div id="en-ui" class="ui-box">
                <div class="name-row"><span id="en-name">Monstro</span><span id="en-lvl" class="lvl-text">Lv 5</span></div>
                <div class="bar-bg"><div id="en-hp" class="hp-fill"></div></div>
            </div>
            <div id="en-sprite" class="sprite"></div>
            <div id="pl-ui" class="ui-box">
                <div class="name-row"><span id="pl-name">Monstro</span><span id="pl-lvl" class="lvl-text">Lv 5</span></div>
                <div class="bar-bg"><div id="pl-hp" class="hp-fill"></div></div>
                <div style="font-size: 11px; text-align: right; margin-bottom: 4px; font-weight: 800;" id="pl-hp-txt"></div>
                <div class="bar-bg" style="height: 4px; margin:0;"><div id="pl-xp" class="xp-fill"></div></div>
            </div>
            <div id="pl-sprite" class="sprite"></div>
            <div id="controls">
                <div id="msg">...</div>
                <div class="btns" id="btn-container"></div>
            </div>
        </div>
    </div>

    <div id="side">
        <button class="side-btn" onclick="curarEquipeBtn()">🏥 CURAR (C)</button>
        <button class="side-btn" onclick="usarRepelenteBtn()" id="btn-repel">🧴 REPELENTE (R)</button>
        
        <div style="font-size: 10px; text-align: center; color: var(--text-muted);">Mover: Setas | Ação: Espaço <br> Criativo: Shift + N</div>
        
        <div id="repel-status">Repelente: 100 passos</div>
        <div id="creative-status">MODO CRIATIVO: ON</div>
        
        <div style="font-size: 10px; text-align: center; margin-top: 5px; color: var(--primary);" id="bag-display">
            10 Cáps. | 5 Poções | 5 Repel.
        </div>
        <hr style="border-color: #334155; width: 100%; margin: 5px 0;">
        <div id="mini-team" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 400px;"></div>
    </div>
</div>

<script>
    // Utils
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // Audio Engine
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function initAudio() { if(!audioCtx) audioCtx = new AudioContext(); }
    
    function playTone(freq, type, dur, vol=0.1) {
        if(!audioCtx) return;
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function sfx(action) {
        initAudio();
        if(action === 'hit') playTone(150, 'square', 0.2, 0.2);
        if(action === 'heal') { playTone(400, 'sine', 0.1); setTimeout(()=>playTone(600, 'sine', 0.3), 100); }
        if(action === 'atk') playTone(600, 'sawtooth', 0.1, 0.1);
        if(action === 'lvl') { playTone(400,'square',0.1); setTimeout(()=>playTone(500,'square',0.1),100); setTimeout(()=>playTone(600,'square',0.3),200); }
        if(action === 'catch') { playTone(800, 'sine', 0.1); setTimeout(()=>playTone(1200, 'sine', 0.2), 150); }
        if(action === 'repel') { playTone(300, 'sine', 0.2); setTimeout(()=>playTone(200, 'sine', 0.3), 150); }
    }

    document.body.addEventListener('click', initAudio, {once:true});
    document.body.addEventListener('keydown', initAudio, {once:true});

    // Game Data
    const TYPES = {
        normal: { color: '#a8a29e', forte: [], fraco: ['pedra'] },
        fogo: { color: '#ef4444', forte: ['planta', 'inseto'], fraco: ['agua', 'pedra'] },
        agua: { color: '#3b82f6', forte: ['fogo', 'pedra'], fraco: ['planta', 'eletrico'] },
        planta: { color: '#10b981', forte: ['agua', 'pedra'], fraco: ['fogo', 'voador', 'inseto'] },
        eletrico: { color: '#eab308', forte: ['agua', 'voador'], fraco: ['planta'] },
        voador: { color: '#38bdf8', forte: ['planta', 'inseto'], fraco: ['pedra', 'eletrico'] },
        pedra: { color: '#78716c', forte: ['fogo', 'voador', 'inseto'], fraco: ['agua', 'planta'] },
        inseto: { color: '#84cc16', forte: ['planta'], fraco: ['fogo', 'voador', 'pedra'] }
    };

    const MOVES = {
        investida: { name: "Investida", type: "normal", pwr: 40, pp: 35, acc: 100, cat: "dmg" },
        arranhao: { name: "Arranhão", type: "normal", pwr: 40, pp: 35, acc: 100, cat: "dmg" },
        brasa: { name: "Brasa", type: "fogo", pwr: 40, pp: 25, acc: 100, cat: "dmg" },
        lancaChamas: { name: "Lança Chamas", type: "fogo", pwr: 90, pp: 15, acc: 100, cat: "dmg" },
        explosaoFogo: { name: "Explosão de Fogo", type: "fogo", pwr: 110, pp: 5, acc: 85, cat: "dmg" },
        fogoFatuo: { name: "Fogo Fátuo", type: "fogo", pwr: 0, pp: 15, acc: 85, cat: "stat", eff: "oppAtk-", desc: "Reduz Atq" },
        jatoAgua: { name: "Jato d'Água", type: "agua", pwr: 40, pp: 25, acc: 100, cat: "dmg" },
        bombaAgua: { name: "Bomba d'Água", type: "agua", pwr: 110, pp: 5, acc: 80, cat: "dmg" },
        chicoteVinha: { name: "Chicote Vinha", type: "planta", pwr: 45, pp: 25, acc: 100, cat: "dmg" },
        raioSolar: { name: "Raio Solar", type: "planta", pwr: 120, pp: 10, acc: 100, cat: "dmg" },
        choque: { name: "Choque", type: "eletrico", pwr: 40, pp: 30, acc: 100, cat: "dmg" },
        relampago: { name: "Relâmpago", type: "eletrico", pwr: 90, pp: 15, acc: 100, cat: "dmg" },
        ventania: { name: "Ventania", type: "voador", pwr: 40, pp: 35, acc: 100, cat: "dmg" },
        pedrada: { name: "Pedrada", type: "pedra", pwr: 50, pp: 15, acc: 90, cat: "dmg" },
        muroPedra: { name: "Muro", type: "pedra", pwr: 0, pp: 20, acc: 100, cat: "stat", eff: "selfDef+", desc: "Aumenta Def" },
        picada: { name: "Picada", type: "inseto", pwr: 35, pp: 40, acc: 100, cat: "dmg" },
        teia: { name: "Teia", type: "inseto", pwr: 0, pp: 20, acc: 95, cat: "stat", eff: "oppSpd-", desc: "Reduz Vel" },
        rugido: { name: "Rugido", type: "normal", pwr: 0, pp: 40, acc: 100, cat: "stat", eff: "oppDef-", desc: "Reduz Def" }
    };

    const SPECIES = [
        { id: "brasinha", name: "Brasinha", type: "fogo", base: {h: 39, a: 52, d: 43, s: 65}, moves: ["investida", "brasa", "fogoFatuo"], evo: { lvl: 16, into: "brasauro" } },
        { id: "brasauro", name: "Brasauro", type: "fogo", base: {h: 78, a: 84, d: 78, s: 100}, moves: ["brasa", "lancaChamas", "explosaoFogo", "fogoFatuo"] },
        { id: "gotinha", name: "Gotinha", type: "agua", base: {h: 44, a: 48, d: 65, s: 43}, moves: ["investida", "jatoAgua", "rugido"], evo: { lvl: 16, into: "torrente" } },
        { id: "torrente", name: "Torrente", type: "agua", base: {h: 79, a: 83, d: 100, s: 78}, moves: ["jatoAgua", "bombaAgua", "rugido"] },
        { id: "folhinha", name: "Folhinha", type: "planta", base: {h: 45, a: 49, d: 49, s: 45}, moves: ["investida", "chicoteVinha", "rugido"], evo: { lvl: 16, into: "arvore" } },
        { id: "arvore", name: "Árvore Anciã", type: "planta", base: {h: 80, a: 82, d: 83, s: 80}, moves: ["chicoteVinha", "raioSolar", "rugido"] },
        { id: "faisca", name: "Faísca", type: "eletrico", base: {h: 35, a: 55, d: 40, s: 90}, moves: ["arranhao", "choque", "teia", "relampago"] },
        { id: "passarinho", name: "Pombito", type: "voador", base: {h: 40, a: 45, d: 40, s: 56}, moves: ["investida", "ventania", "rugido"] },
        { id: "pedregulho", name: "Rochedo", type: "pedra", base: {h: 40, a: 80, d: 100, s: 20}, moves: ["investida", "pedrada", "muroPedra"] },
        { id: "besouro", name: "Casudo", type: "inseto", base: {h: 45, a: 20, d: 55, s: 45}, moves: ["arranhao", "picada", "teia"] }
    ];

    const ZONES = [
        { id: 'floresta', class: 'biome-grass', x: 100, y: 100, w: 600, h: 600, spawns: ['folhinha', 'besouro', 'passarinho'] },
        { id: 'lago', class: 'biome-water', x: 1200, y: 150, w: 500, h: 700, spawns: ['gotinha'] },
        { id: 'vulcao', class: 'biome-volcano', x: 1000, y: 1200, w: 800, h: 600, spawns: ['brasinha', 'pedregulho'] },
        { id: 'planicie', class: 'biome-grass', x: 200, y: 1300, w: 500, h: 400, spawns: ['faisca', 'passarinho', 'pedregulho'] }
    ];

    // System States
    let inventario = { capsulas: 10, pocoes: 5, repelentes: 5 };
    let party = [];
    let activeIdx = 0;
    let enemy = null;
    let gameState = "OVERWORLD";
    let pos = { x: 1000, y: 1000 };
    
    // New Features States
    let creativeMode = false;
    let repelSteps = 0;
    
    let textSpeed = 20;
    let activeTextResolver = null;
    let activeTextTimeout = null;

    function init() {
        const startDiv = document.getElementById('starter-list');
        ['brasinha', 'gotinha', 'folhinha'].forEach(id => {
            let sp = SPECIES.find(s => s.id === id);
            startDiv.innerHTML += `
                <div class="card" onclick="escolherInicial('${id}')">
                    <div class="retro-text" style="color:${TYPES[sp.type].color}; font-size:12px; margin-bottom:10px">${sp.name}</div>
                    <div style="font-size: 11px; margin-bottom: 10px; text-transform:uppercase;">${sp.type}</div>
                    <div class="stat-row"><span>HP:</span><span>${sp.base.h}</span></div>
                    <div class="stat-row"><span>ATK:</span><span>${sp.base.a}</span></div>
                    <div class="stat-row"><span>DEF:</span><span>${sp.base.d}</span></div>
                    <div class="stat-row"><span>SPD:</span><span>${sp.base.s}</span></div>
                </div>`;
        });
        desenharMapa();
        atualizarInventarioUI();
    }

    function desenharMapa() {
        const c = document.getElementById('biomes-container');
        ZONES.forEach(z => {
            const div = document.createElement('div');
            div.className = `biome ${z.class}`;
            div.style.left = z.x + 'px'; div.style.top = z.y + 'px';
            div.style.width = z.w + 'px'; div.style.height = z.h + 'px';
            c.appendChild(div);
        });
    }

    function escolherInicial(id) {
        adicionarMonstro(id, 5, false);
        document.getElementById('start-overlay').style.display = 'none';
        atualizarUI(); renderMap(); sfx('heal');
    }

    function calcularStats(base, lvl) {
        let hp = Math.floor(((base.h * 2) * lvl) / 100) + lvl + 10;
        let atk = Math.floor(((base.a * 2) * lvl) / 100) + 5;
        let def = Math.floor(((base.d * 2) * lvl) / 100) + 5;
        let spd = Math.floor(((base.s * 2) * lvl) / 100) + 5;
        return { hp, atk, def, spd };
    }

    function maxXPFormula(lvl) { return Math.floor(Math.pow(lvl, 3) * 0.8) + 15; }

    function adicionarMonstro(id, lvl, allowShiny = true) {
        let sp = SPECIES.find(s => s.id === id);
        let stats = calcularStats(sp.base, lvl);
        let isShiny = allowShiny && Math.random() < 0.10; 
        
        let monstro = {
            ...sp, id: Math.random().toString(), spId: id, lvl: lvl, xp: 0, maxXp: maxXPFormula(lvl),
            hp: stats.hp, maxHp: stats.hp, atk: stats.atk, def: stats.def, spd: stats.spd,
            mAtk: 1, mDef: 1, mSpd: 1, isShiny: isShiny,
            movepool: sp.moves.map(mId => ({ ...MOVES[mId], id: mId, currentPp: MOVES[mId].pp }))
        };
        party.push(monstro);
    }

    window.addEventListener('keydown', e => {
        // Atalhos Globais e Combate
        if(gameState !== "OVERWORLD") {
            if(e.key.toLowerCase() === 'c' && document.getElementById('battle-screen').style.display === 'none') curarEquipeBtn();
            return;
        }

        // Modo Criativo Toggle
        if(e.shiftKey && e.key.toLowerCase() === 'n') {
            creativeMode = !creativeMode;
            document.getElementById('creative-status').style.display = creativeMode ? 'block' : 'none';
            mostrarAviso(creativeMode ? "Modo Criativo: ATIVADO" : "Modo Criativo: DESATIVADO");
            return;
        }

        // Atalhos de Overworld
        if(e.key.toLowerCase() === 'c') { curarEquipeBtn(); return; }
        if(e.key.toLowerCase() === 'r') { usarRepelenteBtn(); return; }

        // Movimento
        const step = 40; let moved = false;
        if(e.key === 'ArrowUp') { pos.y -= step; moved = true; }
        if(e.key === 'ArrowDown') { pos.y += step; moved = true; }
        if(e.key === 'ArrowLeft') { pos.x -= step; moved = true; }
        if(e.key === 'ArrowRight') { pos.x += step; moved = true; }
        if(e.key === ' ' || e.key === 'Enter') interagirOverworld();

        pos.x = Math.max(0, Math.min(1960, pos.x)); pos.y = Math.max(0, Math.min(1960, pos.y));
        
        if(moved) { 
            // Abate os passos do repelente
            if(repelSteps > 0) {
                repelSteps--;
                document.getElementById('repel-status').innerText = `Repelente: ${repelSteps} passos`;
                if(repelSteps === 0) {
                    document.getElementById('repel-status').style.display = 'none';
                    mostrarAviso("O efeito do repelente acabou!");
                }
            }
            renderMap(); 
            checarEncontro(); 
        }
    });

    function renderMap() {
        const p = document.getElementById('player');
        p.style.left = pos.x + 'px'; p.style.top = pos.y + 'px';
        document.getElementById('world').style.transform = `translate(${360 - pos.x - 16}px, ${270 - pos.y - 16}px)`;
    }

    function interagirOverworld() {
        if(pos.x >= 900 && pos.x <= 1080 && pos.y >= 900 && pos.y <= 1080) curarEquipe(true);
    }

    function checarEncontro() {
        if(creativeMode || repelSteps > 0) return; // Bloqueia encontros

        for(let z of ZONES) {
            if(pos.x >= z.x && pos.x <= z.x + z.w && pos.y >= z.y && pos.y <= z.y + z.h) {
                if(Math.random() < 0.12) {
                    let randSp = z.spawns[Math.floor(Math.random() * z.spawns.length)];
                    let lvl = Math.max(1, party[0].lvl + Math.floor(Math.random()*3) - 1);
                    iniciarBatalha(randSp, lvl);
                    break;
                }
            }
        }
    }

    function atualizarInventarioUI() {
        document.getElementById('bag-display').innerHTML = `
            ${inventario.capsulas} Cáps. | ${inventario.pocoes} Poções | ${inventario.repelentes} Repel.
        `;
        document.getElementById('btn-repel').disabled = inventario.repelentes <= 0;
    }

    function usarRepelenteBtn() {
        if(gameState !== "OVERWORLD") return;
        if(inventario.repelentes <= 0) {
            mostrarAviso("Você não tem Repelentes!");
            return;
        }
        inventario.repelentes--;
        repelSteps = 100;
        sfx('repel');
        document.getElementById('repel-status').style.display = 'block';
        document.getElementById('repel-status').innerText = `Repelente: 100 passos`;
        mostrarAviso("Repelente usado! (100 passos)");
        atualizarInventarioUI();
    }

    function curarEquipe(showMsg = false) {
        party.forEach(m => { m.hp = m.maxHp; m.movepool.forEach(mv => mv.currentPp = mv.pp); });
        atualizarUI(); sfx('heal');
        if(showMsg) mostrarAviso("Sua equipe foi totalmente curada!");
    }
    function curarEquipeBtn() { if(gameState === "OVERWORLD") curarEquipe(true); }

    function mostrarAviso(txt) {
        const el = document.getElementById('sys-notification');
        el.innerText = txt; el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    function getShinyFilter(isShiny) { return isShiny ? "hue-rotate(120deg) saturate(1.5)" : "none"; }

    async function iniciarBatalha(enemyId, lvl) {
        gameState = "BATTLE";
        
        let sp = SPECIES.find(s => s.id === enemyId);
        let stats = calcularStats(sp.base, lvl);
        let isShiny = Math.random() < 0.10; 
        
        enemy = {
            ...sp, spId: enemyId, lvl: lvl, hp: stats.hp, maxHp: stats.hp, atk: stats.atk, def: stats.def, spd: stats.spd,
            mAtk: 1, mDef: 1, mSpd: 1, isShiny: isShiny,
            movepool: sp.moves.map(mId => ({ ...MOVES[mId], id: mId, currentPp: MOVES[mId].pp }))
        };

        if(party[activeIdx].hp <= 0) activeIdx = party.findIndex(m => m.hp > 0);

        document.getElementById('battle-screen').style.display = 'flex';
        party.forEach(m => { m.mAtk=1; m.mDef=1; m.mSpd=1; });
        
        sincronizarBatalha();
        if(isShiny) {
            sfx('catch'); flutuarTexto('en-sprite', '✨ SHINY!', '#fbbf24');
            await escreverNarrativa(`Uau! Um ${enemy.name} BRILHANTE selvagem apareceu!`);
        } else {
            await escreverNarrativa(`Um ${enemy.name} selvagem apareceu!`);
        }
        menuPrincipalBatalha();
    }

    function sincronizarBatalha() {
        let p = party[activeIdx];
        document.getElementById('pl-name').innerHTML = p.name + (p.isShiny ? '<span class="shiny-icon">✨</span>' : '');
        document.getElementById('pl-lvl').innerText = `Lv ${p.lvl}`;
        document.getElementById('pl-hp-txt').innerText = `${Math.ceil(p.hp)}/${p.maxHp}`;
        atualizarBarra('pl-hp', p.hp, p.maxHp);
        atualizarBarra('pl-xp', p.xp, p.maxXp, true);
        
        let plSprite = document.getElementById('pl-sprite');
        plSprite.style.background = `radial-gradient(circle at 30% 30%, ${TYPES[p.type].color}, #111)`;
        plSprite.style.filter = getShinyFilter(p.isShiny);

        document.getElementById('en-name').innerHTML = enemy.name + (enemy.isShiny ? '<span class="shiny-icon">✨</span>' : '');
        document.getElementById('en-lvl').innerText = `Lv ${enemy.lvl}`;
        atualizarBarra('en-hp', enemy.hp, enemy.maxHp);
        
        let enSprite = document.getElementById('en-sprite');
        enSprite.style.background = `radial-gradient(circle at 30% 30%, ${TYPES[enemy.type].color}, #111)`;
        enSprite.style.filter = getShinyFilter(enemy.isShiny);
        
        atualizarUI();
    }

    function atualizarBarra(id, atual, max, isXp = false) {
        let perc = Math.max(0, Math.min(100, (atual/max)*100));
        let el = document.getElementById(id);
        el.style.width = perc + "%";
        if(!isXp) el.style.background = perc > 50 ? 'var(--hp-green)' : perc > 20 ? 'var(--hp-yellow)' : 'var(--hp-red)';
    }

    // --- NOVA FUNÇÃO DE NARRATIVA ANTITRAVAMENTO ---
    function escreverNarrativa(txt) {
        return new Promise(resolve => {
            // Se houver uma animação rodando, finaliza ela imediatamente para evitar loops travados
            if (activeTextResolver) { activeTextResolver(); }
            clearTimeout(activeTextTimeout);
            
            const msgEl = document.getElementById('msg');
            msgEl.innerHTML = "";
            document.getElementById('btn-container').innerHTML = ""; 
            
            let i = 0;
            activeTextResolver = resolve;
            
            function digitar() {
                if(i < txt.length) { 
                    msgEl.innerHTML += txt.charAt(i); 
                    i++; 
                    activeTextTimeout = setTimeout(digitar, textSpeed); 
                } else { 
                    activeTextTimeout = setTimeout(() => {
                        activeTextResolver = null;
                        resolve();
                    }, 800); 
                }
            }
            digitar();
        });
    }

    function flutuarTexto(targetId, text, color) {
        const target = document.getElementById(targetId);
        const div = document.createElement('div');
        div.className = 'fct'; div.innerText = text; div.style.color = color;
        div.style.left = (target.offsetLeft + 50) + 'px'; div.style.top = target.offsetTop + 'px';
        document.getElementById('battle-screen').appendChild(div);
        setTimeout(() => div.remove(), 1000);
    }

    function menuPrincipalBatalha() {
        if(gameState !== "BATTLE") return;
        document.getElementById('msg').innerText = "O que você vai fazer?";
        document.getElementById('btn-container').innerHTML = `
            <button onclick="abrirGolpes()">LUTAR</button>
            <button onclick="abrirTroca(false)">TROCAR</button>
            <button onclick="abrirMochila()">MOCHILA</button>
            <button onclick="tentarFugir()">FUGIR</button>
        `;
    }

    function abrirGolpes() {
        let p = party[activeIdx]; let html = "";
        p.movepool.forEach(m => {
            let color = TYPES[m.type].color;
            let disabled = m.currentPp <= 0 ? "disabled" : "";
            html += `<button class="move-btn" onclick="selecionarAcao({type:'attack', move: '${m.id}'})" style="border-left: 4px solid ${color}" ${disabled}>
                <span style="font-size:12px">${m.name}</span>
                <span class="move-type" style="background:${color}">${m.type}</span>
                <span class="move-pp">PP: ${m.currentPp}/${m.pp} ${m.cat === 'stat' ? '('+m.desc+')' : 'PWR:'+m.pwr}</span>
            </button>`;
        });
        html += `<button onclick="menuPrincipalBatalha()" class="back-btn" style="grid-column: span 2">← VOLTAR</button>`;
        document.getElementById('btn-container').innerHTML = html;
    }

    function abrirMochila() {
        let capDis = inventario.capsulas <= 0 ? "disabled" : "";
        let potDis = inventario.pocoes <= 0 || party[activeIdx].hp === party[activeIdx].maxHp ? "disabled" : "";
        document.getElementById('btn-container').innerHTML = `
            <button onclick="tentarCapturar()" ${capDis}>Cápsula (${inventario.capsulas})</button>
            <button onclick="usarPocaoBatalha()" ${potDis}>Poção (${inventario.pocoes})</button>
            <button onclick="menuPrincipalBatalha()" class="back-btn" style="grid-column: span 2">← VOLTAR</button>
        `;
    }

    async function usarPocaoBatalha() {
        inventario.pocoes--; atualizarInventarioUI(); sfx('heal');
        let p = party[activeIdx]; p.hp = Math.min(p.maxHp, p.hp + 20);
        await escreverNarrativa(`Você usou uma Poção em ${p.name}!`);
        flutuarTexto('pl-sprite', '+20 HP', '#10b981'); sincronizarBatalha();
        await sleep(1000);
        selecionarAcao({type: 'item_use'});
    }

    async function selecionarAcao(playerAction) {
        let validMoves = enemy.movepool.filter(m => m.currentPp > 0);
        let enMove = validMoves.length > 0 ? validMoves[Math.floor(Math.random() * validMoves.length)] : null;
        let enemyAction = enMove ? { type: 'attack', move: enMove.id } : { type: 'struggle' };

        let pSpeed = party[activeIdx].spd * party[activeIdx].mSpd;
        let eSpeed = enemy.spd * enemy.mSpd;
        
        let first = "player", second = "enemy";
        if(eSpeed > pSpeed) { first = "enemy"; second = "player"; }
        else if(eSpeed === pSpeed && Math.random() > 0.5) { first = "enemy"; second = "player"; }

        if(playerAction.type !== 'attack') {
            await executarAcao("enemy", enemyAction);
            checarFimDeBatalha(); return;
        }

        let fAlive = await executarAcao(first, first === "player" ? playerAction : enemyAction);
        if(!fAlive) { checarFimDeBatalha(); return; }
        
        let sAlive = await executarAcao(second, second === "player" ? playerAction : enemyAction);
        if(!sAlive) { checarFimDeBatalha(); return; }

        menuPrincipalBatalha();
    }

    async function executarAcao(actor, action) {
        let atacante = actor === "player" ? party[activeIdx] : enemy;
        let alvo = actor === "player" ? enemy : party[activeIdx];
        let targetId = actor === "player" ? 'en-sprite' : 'pl-sprite';
        let attackerId = actor === "player" ? 'pl-sprite' : 'en-sprite';

        if(action.type === 'attack') {
            let golpe = atacante.movepool.find(m => m.id === action.move);
            golpe.currentPp--;
            await escreverNarrativa(`${atacante.name} usou ${golpe.name}!`);

            sfx('atk');
            let atkSprite = document.getElementById(attackerId);
            atkSprite.classList.add(actor === "player" ? 'anim-atk-pl' : 'anim-atk-en');
            setTimeout(() => atkSprite.classList.remove('anim-atk-pl', 'anim-atk-en'), 300);
            await sleep(300); 

            if(Math.random() * 100 > golpe.acc) { await escreverNarrativa(`Mas o ataque errou!`); return true; }

            if(golpe.cat === 'stat') await aplicarStatus(golpe.eff, atacante, alvo, targetId, attackerId);
            else await aplicarDano(golpe, atacante, alvo, targetId);
        }
        sincronizarBatalha(); return alvo.hp > 0;
    }

    async function aplicarStatus(eff, atacante, alvo, targetId, attackerId) {
        if(eff === "oppAtk-") { alvo.mAtk = Math.max(0.33, alvo.mAtk - 0.2); flutuarTexto(targetId, 'ATK DOWN', '#ef4444'); await escreverNarrativa(`O Ataque de ${alvo.name} caiu!`); }
        if(eff === "oppDef-") { alvo.mDef = Math.max(0.33, alvo.mDef - 0.2); flutuarTexto(targetId, 'DEF DOWN', '#ef4444'); await escreverNarrativa(`A Defesa de ${alvo.name} caiu!`); }
        if(eff === "oppSpd-") { alvo.mSpd = Math.max(0.33, alvo.mSpd - 0.2); flutuarTexto(targetId, 'SPD DOWN', '#ef4444'); await escreverNarrativa(`A Vel. de ${alvo.name} caiu!`); }
        if(eff === "selfDef+") { atacante.mDef = Math.min(3.0, atacante.mDef + 0.5); flutuarTexto(attackerId, 'DEF UP', '#10b981'); await escreverNarrativa(`A Defesa de ${atacante.name} subiu!`); }
    }

    async function aplicarDano(golpe, atacante, alvo, targetSpriteId) {
        let forca = atacante.atk * atacante.mAtk; let defesa = alvo.def * alvo.mDef;
        let stab = atacante.type === golpe.type ? 1.5 : 1; let efetividade = 1;
        if(TYPES[golpe.type].forte.includes(alvo.type)) efetividade = 2;
        if(TYPES[golpe.type].fraco.includes(alvo.type)) efetividade = 0.5;

        let danoBase = (((2 * atacante.lvl / 5) + 2) * golpe.pwr * (forca / defesa)) / 50 + 2;
        let danoFinal = Math.max(1, Math.floor(danoBase * stab * efetividade * (0.85 + Math.random() * 0.15)));
        let crit = Math.random() < 0.0625 ? 1.5 : 1; danoFinal = Math.floor(danoFinal * crit);
        alvo.hp = Math.max(0, alvo.hp - danoFinal);

        sfx('hit');
        let targetSprite = document.getElementById(targetSpriteId);
        targetSprite.classList.add('anim-hit');
        targetSprite.style.filter = "brightness(2) sepia(1) hue-rotate(-50deg) saturate(5)";
        
        setTimeout(() => {
            targetSprite.classList.remove('anim-hit');
            targetSprite.style.filter = getShinyFilter(alvo.isShiny);
        }, 200);

        flutuarTexto(targetSpriteId, `-${danoFinal}`, '#ef4444');
        if(crit > 1) await escreverNarrativa("Acerto Crítico!");
        if(efetividade > 1) await escreverNarrativa("É super efetivo!");
        if(efetividade < 1) await escreverNarrativa("Não é muito efetivo...");
    }

    async function checarFimDeBatalha() {
        let p = party[activeIdx]; sincronizarBatalha();
        if(enemy.hp <= 0) {
            await escreverNarrativa(`${enemy.name} desmaiou!`);
            await ganharXP(); encerrarBatalha();
        } else if(p.hp <= 0) {
            await escreverNarrativa(`${p.name} desmaiou!`);
            if(party.every(m => m.hp <= 0)) {
                await escreverNarrativa("Você não tem monstros vivos. Correndo para a cura!");
                curarEquipe(); pos.x = 980; pos.y = 980; encerrarBatalha(); renderMap();
            } else abrirTroca(true); 
        }
    }

    async function ganharXP() {
        let xpGanha = Math.floor((enemy.lvl * 25 * 1.5) / 7); let p = party[activeIdx];
        await escreverNarrativa(`${p.name} ganhou ${xpGanha} EXP!`);
        p.xp += xpGanha; sincronizarBatalha(); await sleep(500);

        while(p.xp >= p.maxXp) {
            p.lvl++; p.xp -= p.maxXp; p.maxXp = maxXPFormula(p.lvl);
            let spData = SPECIES.find(s=>s.id===p.spId);
            let novosStats = calcularStats(spData.base, p.lvl);
            let hpGain = novosStats.hp - p.maxHp;
            p.maxHp = novosStats.hp; p.hp += hpGain; 
            p.atk = novosStats.atk; p.def = novosStats.def; p.spd = novosStats.spd;

            sfx('lvl');
            await escreverNarrativa(`${p.name} subiu para o Lv ${p.lvl}!`);
            flutuarTexto('pl-sprite', 'LEVEL UP!', '#3b82f6');
            sincronizarBatalha(); await sleep(1000);

            if(p.evo && p.lvl >= p.evo.lvl) {
                let formaEvoluida = SPECIES.find(s => s.id === p.evo.into);
                await escreverNarrativa(`O que está acontecendo? ${p.name} está evoluindo!`);
                await sleep(1500);
                let nomeAntigo = p.name;
                
                p.spId = formaEvoluida.id; p.name = formaEvoluida.name; p.base = formaEvoluida.base;
                p.type = formaEvoluida.type; p.evo = formaEvoluida.evo;
                p.movepool = formaEvoluida.moves.map(mId => ({ ...MOVES[mId], id: mId, currentPp: MOVES[mId].pp }));

                let statsEvoluidos = calcularStats(p.base, p.lvl);
                p.maxHp = statsEvoluidos.hp; p.hp = p.maxHp;
                p.atk = statsEvoluidos.atk; p.def = statsEvoluidos.def; p.spd = statsEvoluidos.spd;

                sincronizarBatalha(); sfx('catch'); flutuarTexto('pl-sprite', 'EVOLUTION!', '#fbbf24');
                await escreverNarrativa(`Incrível! ${nomeAntigo} evoluiu para ${p.name}!`);
                await sleep(1500);
            }
        }
    }

    function abrirTroca(forcar = false) {
        let html = "";
        party.forEach((m, i) => {
            let disabled = (m.hp <= 0 || i === activeIdx) ? "disabled" : "";
            let shinyStar = m.isShiny ? '✨' : '';
            html += `<button onclick="executarTroca(${i}, ${forcar})" style="border-left: 4px solid ${TYPES[m.type].color}" ${disabled}>
                ${m.name} ${shinyStar} Lv${m.lvl}<br><span style="color:${m.hp>0?'var(--hp-green)':'var(--hp-red)'}">${Math.ceil(m.hp)}/${m.maxHp} HP</span>
            </button>`;
        });
        if(!forcar) html += `<button onclick="menuPrincipalBatalha()" class="back-btn" style="grid-column: span 2">← VOLTAR</button>`;
        document.getElementById('btn-container').innerHTML = html;
        if(forcar) document.getElementById('msg').innerText = "Escolha um novo monstro!";
    }

    async function executarTroca(novoIdx, foiForcado) {
        document.getElementById('btn-container').innerHTML = "";
        if(!foiForcado) await escreverNarrativa(`Volte, ${party[activeIdx].name}!`);
        activeIdx = novoIdx; sincronizarBatalha();
        await escreverNarrativa(`Vai, ${party[activeIdx].name}!`);
        if(foiForcado) selecionarAcao({type: 'switch'}); else selecionarAcao({type: 'switch_penalty'}); 
    }

    async function tentarCapturar() {
        document.getElementById('btn-container').innerHTML = "";
        if(party.length >= 6) { await escreverNarrativa("Sua mochila está cheia!"); menuPrincipalBatalha(); return; }
        
        inventario.capsulas--; atualizarInventarioUI();
        await escreverNarrativa("Você atirou a Cápsula!");
        
        let chance = 1 - (enemy.hp / enemy.maxHp); chance += 0.2; 
        
        if(Math.random() < chance) {
            sfx('catch');
            await escreverNarrativa(`Sucesso! ${enemy.name} foi pego!`);
            party.push(JSON.parse(JSON.stringify(enemy)));
            encerrarBatalha();
        } else {
            await escreverNarrativa("Ah não! O monstro escapou!");
            selecionarAcao({type: 'item_use'});
        }
    }

    async function tentarFugir() {
        document.getElementById('btn-container').innerHTML = "";
        let pSpeed = party[activeIdx].spd; let eSpeed = enemy.spd;
        let chance = (pSpeed * 128 / eSpeed + 30) % 256;
        
        if(Math.random()*256 < chance || pSpeed >= eSpeed) { await escreverNarrativa("Você fugiu com sucesso!"); encerrarBatalha(); } 
        else { await escreverNarrativa("Não conseguiu escapar!"); selecionarAcao({type: 'failed_run'}); }
    }

    function encerrarBatalha() { document.getElementById('battle-screen').style.display = 'none'; gameState = "OVERWORLD"; atualizarUI(); }

    function atualizarUI() {
        const side = document.getElementById('mini-team');
        side.innerHTML = party.map((m, i) => {
            let hpPerc = Math.max(0, (m.hp/m.maxHp)*100);
            let color = hpPerc > 50 ? 'var(--hp-green)' : hpPerc > 20 ? 'var(--hp-yellow)' : 'var(--hp-red)';
            let borderColor = i === activeIdx && gameState === "BATTLE" ? 'var(--primary)' : '#475569';
            let sIcon = m.isShiny ? '<span class="shiny-icon" style="font-size:10px">✨</span>' : '';
            return `
            <div class="mini-card" style="border-left-color: ${borderColor}">
                <div style="display:flex; justify-content:space-between"><span>${m.name} ${sIcon}</span><span>Lv ${m.lvl}</span></div>
                <div class="mini-hp-bar"><div class="mini-hp-fill" style="width:${hpPerc}%; background:${color}"></div></div>
                <div style="text-align:right; font-size:9px">${Math.ceil(m.hp)}/${m.maxHp}</div>
            </div>`;
        }).join('');
    }

    init();
</script>
