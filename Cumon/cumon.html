<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pixel Monsters - Complete Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        /* --- Estilos Globais --- */
        * { box-sizing: border-box; }
        body { 
            background: #222; display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; font-family: 'Press Start 2P', cursive; color: #333;
        }
        
        /* --- Layout Principal --- */
        #game-wrapper {
            display: flex; gap: 20px;
        }

        #game-container { 
            position: relative; width: 480px; height: 480px; background: #8fd032; 
            border: 12px solid #e0e0e0; border-radius: 8px; overflow: hidden; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Painel Lateral (Status do Jogador) */
        #side-panel {
            width: 200px; background: #eee; border: 12px solid #e0e0e0; 
            border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 15px;
        }
        .side-title { font-size: 14px; text-align: center; border-bottom: 4px solid #333; padding-bottom: 10px; }
        .side-stat { font-size: 10px; line-height: 1.5; }
        .exp-bar { height: 8px; background: #ccc; border: 2px solid #333; margin-top: 5px; }
        .exp-fill { height: 100%; background: #9b59b6; width: 0%; transition: 0.3s; }

        /* --- Mundo (Mapa) --- */
        .grass { 
            position: absolute; width: 48px; height: 48px; 
            background: repeating-linear-gradient(45deg, #3d8a1f, #3d8a1f 5px, #469e24 5px, #469e24 10px); 
            border: 2px solid #2e6917; 
        }
        #player { 
            position: absolute; width: 40px; height: 40px; background: #e74c3c; 
            border: 4px solid #fff; box-shadow: inset -4px -4px 0px rgba(0,0,0,0.2), 0 4px 0 #000;
            z-index: 10; transition: top 0.15s, left 0.15s; border-radius: 4px;
        }

        /* --- Tela de Batalha --- */
        #battle-screen { 
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #f8f8f8; z-index: 100; flex-direction: column;
        }

        /* Status dos Monstros na Batalha */
        .status-box { 
            position: absolute; background: #fff; border: 4px solid #333; 
            padding: 10px; border-radius: 8px; width: 220px; box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        }
        #enemy-status { top: 20px; left: 20px; }
        #player-status { bottom: 160px; right: 20px; }
        
        .name { font-size: 12px; margin-bottom: 8px; text-transform: uppercase; }
        .hp-bar-bg { width: 100%; height: 12px; background: #555; border: 2px solid #333; border-radius: 4px; }
        .hp-fill { height: 100%; background: #2ecc71; width: 100%; transition: width 0.4s ease-out; }
        .hp-text { font-size: 10px; text-align: right; margin-top: 5px; }

        /* Sprites (Monstros) */
        .sprite { 
            position: absolute; width: 80px; height: 80px; border: 4px solid #000; 
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2); border-radius: 8px; transition: opacity 0.2s;
        }
        #enemy-sprite { top: 40px; right: 40px; background: #ccc; }
        #player-sprite { bottom: 180px; left: 40px; background: #3498db; }

        /* Interface Inferior (Textos e Botões) */
        #bottom-panel { 
            position: absolute; bottom: 0; width: 100%; height: 140px; 
            background: #fff; border-top: 6px solid #333; display: flex;
        }
        #dialogue-box { 
            flex: 1; padding: 20px; font-size: 12px; line-height: 1.8; 
            border-right: 6px solid #333; display: flex; align-items: center;
        }
        
        /* Menus */
        .menu { display: none; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 200px; }
        button { 
            background: #fff; border: none; border-right: 2px solid #ddd; border-bottom: 2px solid #ddd;
            font-family: inherit; font-size: 10px; cursor: pointer; text-transform: uppercase;
        }
        button:hover { background: #eee; }
        button:active { background: #ddd; }
        button:disabled { background: #eee; color: #aaa; cursor: not-allowed; }
        .back-btn { background: #ffcccc; }
        .back-btn:hover { background: #ff9999; }

        /* --- Animações --- */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .damage-anim { animation: shake 0.3s; }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .capture-anim { animation: blink 0.2s 5; }

    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="side-panel">
        <div class="side-title">Seu Status</div>
        <div class="side-stat">Nível: <span id="ui-level">1</span></div>
        <div class="side-stat">Vida: <span id="ui-hp">100/100</span></div>
        <div class="side-stat">
            EXP: <span id="ui-exp-text">0/50</span>
            <div class="exp-bar"><div id="ui-exp-fill" class="exp-fill"></div></div>
        </div>
        <div class="side-stat" style="margin-top:auto; font-size:8px; color:#666;">Use as SETAS para andar</div>
    </div>

    <div id="game-container">
        
        <div id="player" style="top: 240px; left: 240px;"></div>
        
        <div id="battle-screen">
            
            <div id="enemy-status" class="status-box">
                <div id="enemy-name" class="name">Monstro</div>
                <div class="hp-bar-bg"><div id="enemy-hp-fill" class="hp-fill"></div></div>
            </div>
            <div id="enemy-sprite" class="sprite"></div>

            <div id="player-status" class="status-box">
                <div class="name">Você</div>
                <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-fill"></div></div>
                <div id="player-hp-text" class="hp-text">100/100</div>
            </div>
            <div id="player-sprite" class="sprite"></div>

            <div id="bottom-panel">
                <div id="dialogue-box">Um monstro selvagem apareceu!</div>
                
                <div id="action-menu" class="menu">
                    <button onclick="showAttacks()">Bater</button>
                    <button onclick="capture()">Capturar</button>
                    <button id="btn-heal" onclick="heal()">Curar</button>
                    <button onclick="run()">Fugir</button>
                </div>

                <div id="attack-menu" class="menu">
                    <button onclick="executeTurn('fogo')">Fogo</button>
                    <button onclick="executeTurn('agua')">Água</button>
                    <button onclick="executeTurn('planta')">Planta</button>
                    <button class="back-btn" onclick="backToActionMenu()">Voltar</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // ---- Configurações e Dados ----
    const TILE_SIZE = 48;
    const playerMap = { x: 240, y: 240 };
    
    // Status do Jogador (Salvo entre batalhas)
    const playerStats = { 
        level: 1, 
        hp: 100, 
        maxHp: 100,
        exp: 0,
        expToNext: 50
    };

    let enemy = null;
    let inBattle = false;
    let isActionLocked = false;
    let hasHealedThisBattle = false;

    // Sistema de Elementos
    const types = {
        fogo: { forte: 'planta', fraco: 'agua', nome: 'Fogo' },
        agua: { forte: 'fogo', fraco: 'planta', nome: 'Água' },
        planta: { forte: 'agua', fraco: 'fogo', nome: 'Planta' }
    };

    // Banco de Monstros
    const monsters = [
        { name: "Brasa", type: "fogo", color: "#e74c3c" },
        { name: "Gota", type: "agua", color: "#3498db" },
        { name: "Broto", type: "planta", color: "#2ecc71" }
    ];

    // ---- Geração do Mapa ----
    const container = document.getElementById('game-container');
    for(let i=0; i<14; i++) {
        let g = document.createElement('div');
        g.className = 'grass';
        g.style.left = Math.floor(Math.random() * 10) * TILE_SIZE + 'px';
        g.style.top = Math.floor(Math.random() * 10) * TILE_SIZE + 'px';
        container.appendChild(g);
    }

    // ---- Movimentação ----
    window.addEventListener('keydown', (e) => {
        if(inBattle) return;
        let pElem = document.getElementById('player');
        
        if(e.key === 'ArrowUp' && playerMap.y > 0) playerMap.y -= TILE_SIZE;
        if(e.key === 'ArrowDown' && playerMap.y < 432) playerMap.y += TILE_SIZE;
        if(e.key === 'ArrowLeft' && playerMap.x > 0) playerMap.x -= TILE_SIZE;
        if(e.key === 'ArrowRight' && playerMap.x < 432) playerMap.x += TILE_SIZE;
        
        pElem.style.top = playerMap.y + 'px';
        pElem.style.left = playerMap.x + 'px';
        
        checkEncounter();
    });

    function checkEncounter() {
        if(Math.random() < 0.12) { // 12% chance
            setTimeout(startBattle, 200);
        }
    }

    // ---- Funções de UI Auxiliares ----

    function updateLevelUI() {
        document.getElementById('ui-level').innerText = playerStats.level;
        document.getElementById('ui-hp').innerText = `${playerStats.hp}/${playerStats.maxHp}`;
        document.getElementById('ui-exp-text').innerText = `${playerStats.exp}/${playerStats.expToNext}`;
        
        let expPct = (playerStats.exp / playerStats.expToNext) * 100;
        document.getElementById('ui-exp-fill').style.width = expPct + "%";
    }

    function setDialogue(text) {
        document.getElementById('dialogue-box').innerText = text;
    }

    function toggleActionMenu(show) {
        document.getElementById('action-menu').style.display = show ? 'grid' : 'none';
        // Desabilita botão de curar se já usou
        document.getElementById('btn-heal').disabled = hasHealedThisBattle;
    }

    function toggleAttackMenu(show) {
        document.getElementById('attack-menu').style.display = show ? 'grid' : 'none';
    }

    function backToActionMenu() {
        if (isActionLocked) return;
        toggleAttackMenu(false);
        toggleActionMenu(true);
    }

    function updateBars() {
        // Barras da batalha
        let enemyPct = Math.max((enemy.hp / enemy.maxHp) * 100, 0);
        let playerPct = Math.max((playerStats.hp / playerStats.maxHp) * 100, 0);
        
        document.getElementById('enemy-hp-fill').style.width = enemyPct + "%";
        document.getElementById('player-hp-fill').style.width = playerPct + "%";
        document.getElementById('player-hp-text').innerText = `${Math.max(playerStats.hp, 0)}/${playerStats.maxHp}`;
        
        // Atualiza painel lateral também
        updateLevelUI();
    }

    function shakeSprite(spriteId) {
        const el = document.getElementById(spriteId);
        el.classList.remove('damage-anim');
        void el.offsetWidth; // Force reflow
        el.classList.add('damage-anim');
    }

    function playCaptureAnim() {
        const el = document.getElementById('enemy-sprite');
        el.classList.add('capture-anim');
        setTimeout(() => {
            el.classList.remove('capture-anim');
        }, 1000);
    }

    // ---- Lógica de Batalha Principal ----

    function startBattle() {
        inBattle = true;
        isActionLocked = true;
        hasHealedThisBattle = false;

        // Inimigo escala com o nível do jogador (-2 a +2 níveis)
        let levelOffset = Math.floor(Math.random() * 5) - 2;
        let enemyLevel = Math.max(1, playerStats.level + levelOffset);

        enemy = {
            ...monsters[Math.floor(Math.random() * monsters.length)],
            level: enemyLevel,
            maxHp: 80 + (enemyLevel * 20),
        };
        enemy.hp = enemy.maxHp;

        // Configuração Visual
        document.getElementById('enemy-name').innerText = `Lv${enemy.level} ${enemy.name}`;
        document.getElementById('enemy-sprite').style.background = enemy.color;
        document.getElementById('battle-screen').style.display = 'flex';
        
        updateBars();
        toggleActionMenu(false);
        toggleAttackMenu(false);

        setDialogue(`Um ${enemy.name} selvagem (Lv${enemy.level}) apareceu!`);

        setTimeout(() => {
            setDialogue("O que você vai fazer?");
            toggleActionMenu(true);
            isActionLocked = false;
        }, 2000);
    }

    // -- Ações do Jogador --

    function showAttacks() {
        if (isActionLocked) return;
        toggleActionMenu(false);
        toggleAttackMenu(true);
    }

    function heal() {
        if (isActionLocked || hasHealedThisBattle) return;
        
        isActionLocked = true;
        toggleActionMenu(false);
        hasHealedThisBattle = true;

        let healAmount = Math.floor(playerStats.maxHp * 0.5); // 50% de cura
        playerStats.hp = Math.min(playerStats.maxHp, playerStats.hp + healAmount);
        
        setDialogue(`Você se curou em ${healAmount} PV!`);
        updateBars();

        setTimeout(enemyTurn, 2000);
    }

    function capture() {
        if (isActionLocked) return;
        isActionLocked = true;
        toggleActionMenu(false);

        setDialogue("Você jogou uma Cápsula de Captura!");
        playCaptureAnim();

        setTimeout(() => {
            // Chance de captura baseada na vida faltante do inimigo
            let hpPercent = enemy.hp / enemy.maxHp;
            let captureChance = 0.2 + (0.6 * (1 - hpPercent)); // Ex: HP cheio = 20%, HP 1 = ~80%

            if (Math.random() < captureChance) {
                setDialogue(`Sucesso! Você capturou o ${enemy.name}!`);
                setTimeout(() => {
                    let expBonus = enemy.level * 15;
                    setDialogue(`Bônus de Captura: ${expBonus} EXP!`);
                    gainExp(expBonus);
                    setTimeout(endBattle, 2500);
                }, 2000);
            } else {
                setDialogue(`Oh não! O ${enemy.name} escapou da cápsula!`);
                setTimeout(enemyTurn, 2000);
            }
        }, 1500);
    }

    function run() {
        if (isActionLocked) return;
        isActionLocked = true;
        toggleActionMenu(false);
        toggleAttackMenu(false);

        if (Math.random() > 0.4) {
            setDialogue("Você fugiu com sucesso!");
            setTimeout(endBattle, 1500);
        } else {
            setDialogue("Não conseguiu fugir!");
            setTimeout(enemyTurn, 1500);
        }
    }

    function executeTurn(attackType) {
        if (isActionLocked) return;
        isActionLocked = true;
        toggleAttackMenu(false);

        setDialogue(`Você usou ${types[attackType].nome}!`);

        setTimeout(() => {
            // Cálculo de Dano do Jogador (escala com nível)
            let baseDamage = 15 + (playerStats.level * 5);
            let multiplier = 1;
            let msg = "";

            if (types[attackType].forte === enemy.type) {
                multiplier = 2;
                msg = "Foi super efetivo!";
            } else if (types[attackType].fraco === enemy.type) {
                multiplier = 0.5;
                msg = "Não é muito efetivo...";
            }

            let damage = Math.floor(baseDamage * multiplier);
            enemy.hp -= damage;
            shakeSprite('enemy-sprite');
            updateBars();

            if (msg) setDialogue(msg);

            setTimeout(() => {
                if (enemy.hp <= 0) {
                    winBattle();
                } else {
                    enemyTurn();
                }
            }, 1500);

        }, 1500);
    }

    // -- Turno do Inimigo --

    function enemyTurn() {
        setDialogue(`${enemy.name} atacou!`);

        setTimeout(() => {
            let enemyDamage = 10 + (enemy.level * 4); // Dano escala com o nível dele
            
            playerStats.hp -= enemyDamage;
            shakeSprite('player-sprite');
            updateBars();

            setTimeout(() => {
                if (playerStats.hp <= 0) {
                    loseBattle();
                } else {
                    setDialogue("O que você vai fazer?");
                    toggleActionMenu(true);
                    isActionLocked = false;
                }
            }, 1500);
        }, 1500);
    }

    // -- Resolução de Batalha e Progressão --

    function gainExp(amount) {
        playerStats.exp += amount;
        updateLevelUI();

        if (playerStats.exp >= playerStats.expToNext) {
            playerStats.level++;
            playerStats.exp -= playerStats.expToNext;
            playerStats.expToNext = Math.floor(playerStats.expToNext * 1.5); // Curva de EXP
            playerStats.maxHp += 20;
            playerStats.hp = playerStats.maxHp; // Cura ao upar
            
            setDialogue(`Subiu para o Nível ${playerStats.level}! Vida máxima aumentou!`);
            updateLevelUI();
        }
    }

    function winBattle() {
        setDialogue(`${enemy.name} desmaiou!`);
        setTimeout(() => {
            let expGained = enemy.level * 10;
            setDialogue(`Você ganhou ${expGained} EXP!`);
            gainExp(expGained);
            
            setTimeout(endBattle, 3000);
        }, 1500);
    }

    function loseBattle() {
        setDialogue("Você perdeu... Voltando com a vida restaurada.");
        setTimeout(() => {
            playerStats.hp = playerStats.maxHp;
            updateBars();
            endBattle();
        }, 2500);
    }

    function endBattle() {
        document.getElementById('battle-screen').style.display = 'none';
        inBattle = false;
        isActionLocked = false;
    }

    // Setup Inicial
    updateLevelUI();

</script>
</body>
</html>
